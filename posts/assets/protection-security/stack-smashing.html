<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stack Smashing</title>
<style>
  :root {
    --bg: #FAF9F5; --ink: #2C2C2A; --muted: #6B6A64; --lane: #F1EFE8; --card: #FFFFFF; --stroke: #D3D1C7;
    --core: #534AB7; --core-bg: #EEEDFE; --core-ink: #26215C;
    --hw: #BA7517; --hw-bg: #FAEEDA; --hw-ink: #633806; --ret: #0F6E56; --ret-bg: #E1F5EE;
    --bad: #A32D2D; --bad-bg: #FCEBEB;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1A1A18; --ink: #F1EFE8; --muted: #B4B2A9; --lane: #232321; --card: #262624; --stroke: #444441;
      --core: #AFA9EC; --core-bg: #26215C; --core-ink: #EEEDFE;
      --hw: #EF9F27; --hw-bg: #412402; --hw-ink: #FAEEDA; --ret: #5DCAA5; --ret-bg: #04342C;
      --bad: #F09595; --bad-bg: #501313;
    }
  }
  body { margin: 0; background: var(--bg); padding: 20px; font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  figure { margin: 0 auto; max-width: 1000px; }
  svg { width: 100%; height: auto; display: block; }
  .t { fill: var(--ink); font-size: 15px; font-weight: 700; }
  .s { fill: var(--muted); font-size: 12.5px; }
  .m { font-family: "JetBrains Mono", Consolas, monospace; }
  .sl { font-size: 14px; font-weight: 700; fill: var(--ink); }
  .v { font-family: "JetBrains Mono", Consolas, monospace; font-size: 12.5px; font-weight: 700; text-anchor: end; fill: var(--muted); }
  .vb { font-family: "JetBrains Mono", Consolas, monospace; font-size: 12.5px; font-weight: 700; text-anchor: end; fill: var(--bad); }
  .ico { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .b text { font-size: 13px; font-weight: 700; fill: #fff; text-anchor: middle; }
</style>
</head>
<body>
<figure>
<svg viewBox="0 0 1000 520" role="img" aria-label="스택 프레임 두 개. 왼쪽 정상 호출에서는 높은 주소부터 호출자 프레임, 복귀 주소, 저장된 rbp, 카나리, buf[16]이 놓이고 strcpy는 buf의 낮은 주소에서 높은 주소 쪽으로 쓴다. 오른쪽은 40바이트 입력이 buf를 넘쳐 카나리, 저장된 rbp, 복귀 주소까지 덮어쓴 모습이다. 복귀 주소가 buf를 가리키게 바뀌지만 막힌다. 오른쪽 패널의 완화 기법: 1 스택 카나리는 복귀 직전에 값을 비교해 바뀌었으면 종료, 2 NX/DEP는 스택 페이지 실행 금지, 3 ASLR은 실행마다 주소를 바꾼다">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="var(--muted)"/></marker>
    <marker id="ah-bad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="var(--bad)"/></marker>
    <pattern id="fillA" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="var(--bad-bg)"/><line x1="0" y1="0" x2="0" y2="10" stroke="var(--bad)" stroke-width="1.2" opacity="0.35"/></pattern>
  </defs>

  <!-- address axis -->
  <line x1="44" y1="452" x2="44" y2="74" stroke="var(--muted)" stroke-width="1.6" marker-end="url(#ah)"/>
  <text class="s" x="44" y="58" text-anchor="middle">높은 주소</text>
  <text class="s" x="44" y="474" text-anchor="middle">낮은 주소</text>

  <!-- column A: normal -->
  <text class="t" x="205" y="46" text-anchor="middle">정상 호출</text>
  <rect x="80" y="66" width="250" height="46" rx="10" fill="var(--lane)" stroke="var(--stroke)"/>
  <text class="s" x="94" y="94">호출자 프레임</text>
  <rect x="80" y="118" width="250" height="52" rx="10" fill="var(--ret-bg)" stroke="var(--ret)" stroke-width="1.4"/>
  <text class="sl" x="94" y="149" style="fill:var(--ret)">복귀 주소</text>
  <text class="v" x="316" y="149">0x401196</text>
  <rect x="80" y="176" width="250" height="52" rx="10" fill="var(--card)" stroke="var(--stroke)"/>
  <text class="sl" x="94" y="207">저장된 <tspan class="m">rbp</tspan></text>
  <text class="v" x="316" y="207">0x7ffd…e0</text>
  <rect x="80" y="234" width="250" height="52" rx="10" fill="var(--card)" stroke="var(--ret)" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text class="sl" x="94" y="265" style="fill:var(--ret)">카나리</text>
  <text class="s" x="316" y="265" text-anchor="end" font-weight="700">무작위</text>
  <rect x="80" y="292" width="250" height="160" rx="10" fill="var(--card)" stroke="var(--core)" stroke-width="1.4"/>
  <text class="sl m" x="94" y="318" style="fill:var(--core)">buf[16]</text>
  <rect x="92" y="410" width="80" height="30" rx="6" fill="var(--core-bg)" stroke="var(--core)"/>
  <text class="m" x="132" y="430" text-anchor="middle" font-size="13" font-weight="700" fill="var(--core-ink)">"os"</text>
  <line x1="300" y1="440" x2="300" y2="332" stroke="var(--muted)" stroke-width="1.6" marker-end="url(#ah)"/>
  <text class="s m" x="290" y="434" text-anchor="end">strcpy</text>

  <!-- column B: after overflow -->
  <text class="t" x="545" y="46" text-anchor="middle">넘친 뒤</text>
  <rect x="420" y="66" width="250" height="46" rx="10" fill="var(--lane)" stroke="var(--stroke)"/>
  <text class="s" x="434" y="94">호출자 프레임</text>
  <rect x="420" y="118" width="250" height="52" rx="10" fill="url(#fillA)" stroke="var(--bad)" stroke-width="1.8"/>
  <text class="sl" x="434" y="149" style="fill:var(--bad)">복귀 주소</text>
  <text class="vb" x="656" y="149">→ buf</text>
  <rect x="420" y="176" width="250" height="52" rx="10" fill="url(#fillA)" stroke="var(--bad)" stroke-width="1.8"/>
  <text class="sl" x="434" y="207" style="fill:var(--bad)">저장된 <tspan class="m">rbp</tspan></text>
  <text class="vb" x="656" y="207">AAAAAAAA</text>
  <rect x="420" y="234" width="250" height="52" rx="10" fill="url(#fillA)" stroke="var(--bad)" stroke-width="1.8"/>
  <text class="sl" x="434" y="265" style="fill:var(--bad)">카나리</text>
  <text class="vb" x="656" y="265">AAAAAAAA</text>
  <rect x="420" y="292" width="250" height="160" rx="10" fill="url(#fillA)" stroke="var(--bad)" stroke-width="1.8"/>
  <text class="sl m" x="434" y="318" style="fill:var(--bad)">buf[16]</text>
  <text class="vb" x="656" y="388">AAAAAAAA</text>
  <text class="vb" x="656" y="430">AAAAAAAA</text>
  <!-- overflow arrow -->
  <line x1="690" y1="446" x2="690" y2="124" stroke="var(--bad)" stroke-width="3" marker-end="url(#ah-bad)"/>
  <text class="s" x="545" y="482" text-anchor="middle" style="fill:var(--bad)">입력 40바이트</text>
  <text class="s" x="205" y="482" text-anchor="middle">입력 3바이트</text>

  <!-- hijack path: return address -> buf (blocked) -->
  <path d="M418 160 H362 V336 H414" fill="none" stroke="var(--bad)" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah-bad)"/>
  <circle cx="362" cy="250" r="13" fill="var(--card)" stroke="var(--bad)" stroke-width="2"/>
  <path d="M356 244l12 12M368 244l-12 12" stroke="var(--bad)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- badges on column B -->
  <g class="b">
    <circle cx="398" cy="260" r="12" fill="var(--ret)"/><text x="398" y="265">1</text>
    <circle cx="398" cy="420" r="12" fill="var(--core)"/><text x="398" y="425">2</text>
    <circle cx="398" cy="132" r="12" fill="var(--hw)"/><text x="398" y="137">3</text>
  </g>

  <!-- mitigation panel -->
  <rect x="730" y="66" width="230" height="118" rx="12" fill="var(--ret-bg)" stroke="var(--ret)" stroke-width="1.4"/>
  <g class="b"><circle cx="756" cy="92" r="12" fill="var(--ret)"/><text x="756" y="97">1</text></g>
  <text class="t" x="776" y="97" style="fill:var(--ret)">스택 카나리</text>
  <text class="m" x="748" y="126" font-size="11" font-weight="700" fill="var(--ret)">-fstack-protector</text>
  <text class="sl" x="748" y="160" font-size="13">복귀 직전 비교 → 종료</text>

  <rect x="730" y="200" width="230" height="118" rx="12" fill="var(--core-bg)" stroke="var(--core)" stroke-width="1.4"/>
  <g class="b"><circle cx="756" cy="226" r="12" fill="var(--core)"/><text x="756" y="231">2</text></g>
  <text class="t" x="776" y="231" style="fill:var(--core-ink)">NX · DEP</text>
  <text class="m" x="748" y="260" font-size="11" font-weight="700" fill="var(--core)">PTE bit 63 = 1</text>
  <text class="sl" x="748" y="294" font-size="13">스택 페이지 실행 금지</text>

  <rect x="730" y="334" width="230" height="118" rx="12" fill="var(--hw-bg)" stroke="var(--hw)" stroke-width="1.4"/>
  <g class="b"><circle cx="756" cy="360" r="12" fill="var(--hw)"/><text x="756" y="365">3</text></g>
  <text class="t" x="776" y="365" style="fill:var(--hw-ink)">ASLR</text>
  <text class="m" x="748" y="394" font-size="11" font-weight="700" fill="var(--hw)">randomize_va_space=2</text>
  <text class="sl" x="748" y="428" font-size="13">실행마다 다른 주소</text>
</svg>
</figure>
</body>
</html>
