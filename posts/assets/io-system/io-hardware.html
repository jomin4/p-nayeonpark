<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I/O Hardware</title>
<style>
  :root {
    --bg: #FAF9F5; --ink: #2C2C2A; --muted: #6B6A64; --lane: #F1EFE8; --card: #FFFFFF; --stroke: #D3D1C7;
    --core: #534AB7; --core-bg: #EEEDFE; --core-ink: #26215C;
    --hw: #BA7517; --hw-bg: #FAEEDA; --hw-ink: #633806;
    --ret: #0F6E56; --ret-bg: #E1F5EE; --ret-ink: #04342C;
    --blu: #185FA5; --blu-bg: #E6F1FB; --blu-ink: #042C53;
    --bad: #A32D2D; --bad-bg: #FCEBEB;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1A1A18; --ink: #F1EFE8; --muted: #B4B2A9; --lane: #232321; --card: #262624; --stroke: #444441;
      --core: #AFA9EC; --core-bg: #26215C; --core-ink: #EEEDFE;
      --hw: #EF9F27; --hw-bg: #412402; --hw-ink: #FAEEDA;
      --ret: #5DCAA5; --ret-bg: #04342C; --ret-ink: #E1F5EE;
      --blu: #85B7EB; --blu-bg: #042C53; --blu-ink: #E6F1FB;
      --bad: #F09595; --bad-bg: #501313;
    }
  }
  body { margin: 0; background: var(--bg); padding: 20px; font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  figure { margin: 0 auto; max-width: 1000px; }
  svg { width: 100%; height: auto; display: block; }
  .t { fill: var(--ink); font-size: 15px; font-weight: 700; }
  .s { fill: var(--muted); font-size: 12.5px; }
  .m { font-family: "JetBrains Mono", Consolas, monospace; }
  .ico { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .arr { stroke: var(--muted); stroke-width: 1.8; fill: none; }
</style>
</head>
<body>
<figure>
<svg viewBox="0 0 1000 464" role="img" aria-label="CPU와 메모리, 장치 컨트롤러가 버스로 이어져 있고 컨트롤러는 상태·명령·데이터 레지스터를 가진다. 포트 입출력은 메모리와 별도인 포트 주소 공간을 in/out 명령으로, 메모리 맵 입출력은 하나의 주소 공간 안의 장치 레지스터 영역을 일반 mov 명령으로 접근한다">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="var(--muted)"/></marker>
    <marker id="ah-hw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="var(--hw)"/></marker>
    <marker id="ah-core" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="var(--core)"/></marker>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="var(--stroke)" stroke-width="3"/></pattern>
  </defs>
<rect x="30" y="20" width="470" height="424" rx="16" fill="var(--lane)"/>

  <g class="ico" style="stroke:var(--hw)" transform="translate(74 73)"><rect x="8" y="8" width="26" height="26" rx="3"/><rect x="15" y="15" width="12" height="12"/><path d="M15 8V3M21 8V3M27 8V3M15 34v5M21 34v5M27 34v5M8 15H3M8 21H3M8 27H3M34 15h5M34 21h5M34 27h5"/></g>

  <text class="t" x="236" y="412" style="fill:var(--hw)">디스크</text>

  <rect x="535" y="148" width="85" height="232" rx="10" fill="var(--core-bg)" stroke="var(--core)"/>

  <rect x="635" y="148" width="85" height="176" rx="10" fill="var(--card)" stroke="var(--hw)"/>
  <rect x="642" y="156" width="71" height="48" rx="8" fill="var(--hw-bg)" stroke="var(--hw)" stroke-width="1"/>
  <text class="m" x="677" y="176" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--hw-ink)">0x1F0</text>
  <text class="s" x="677" y="194" text-anchor="middle">데이터</text>
  <rect x="642" y="212" width="71" height="48" rx="8" fill="var(--hw-bg)" stroke="var(--hw)" stroke-width="1"/>
  <text class="m" x="677" y="232" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--hw-ink)">0x1F7</text>
  <text class="s" x="677" y="250" text-anchor="middle">명령·상태</text>
  <rect x="642" y="268" width="71" height="48" rx="8" fill="var(--hw-bg)" stroke="var(--hw)" stroke-width="1"/>
  <text class="m" x="677" y="288" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--hw-ink)">0x3F6</text>
  <text class="s" x="677" y="306" text-anchor="middle">제어</text>
  <text class="s" x="677" y="346" text-anchor="middle" style="font-weight:700">포트 주소</text>
  <rect x="560" y="396" width="135" height="28" rx="14" fill="var(--card)" stroke="var(--core)"/>

  <text class="s" x="602" y="415" style="font-weight:700;fill:var(--core)">특권 명령</text>
  <rect x="755" y="20" width="215" height="424" rx="16" fill="var(--lane)"/>

  <rect x="800" y="84" width="125" height="26" rx="13" fill="var(--card)" stroke="var(--core)"/>
  <text class="m" x="862" y="102" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--core)">mov</text>

  <rect x="800" y="258" width="125" height="64" rx="10" fill="var(--hw-bg)" stroke="var(--hw)" stroke-width="1.6"/>
  <text class="t" x="862" y="284" text-anchor="middle" style="fill:var(--hw-ink);font-size:14px">장치 레지스터</text>
  <text class="s m" x="862" y="304" text-anchor="middle">STATUS·CMD·DATA</text>
  <rect x="800" y="328" width="125" height="52" rx="10" fill="var(--core-bg)" stroke="var(--core)"/>
  <text class="s m" x="862" y="359" text-anchor="middle">RAM</text>

  <rect x="790" y="396" width="145" height="28" rx="14" fill="var(--card)" stroke="var(--core)"/>
  <g class="ico" style="stroke:var(--core)" transform="translate(806 400)"><rect x="0" y="7" width="14" height="11" rx="2"/><path d="M3 7V4.5a4 4 0 0 1 8 0V7"/></g>
  <text class="s" x="830" y="415" style="font-weight:700;fill:var(--core)">페이지 권한</text>

</body>
</html>
