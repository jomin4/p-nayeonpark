<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HDD Anatomy</title>
<style>
  :root {
    --bg: #FAF9F5; --ink: #2C2C2A; --muted: #6B6A64; --lane: #F1EFE8; --card: #FFFFFF; --stroke: #D3D1C7;
    --core: #534AB7; --core-bg: #EEEDFE; --core-ink: #26215C;
    --hw: #BA7517; --hw-bg: #FAEEDA; --hw-ink: #633806;
    --ret: #0F6E56; --ret-bg: #E1F5EE; --ret-ink: #04342C;
    --blu: #185FA5; --blu-bg: #E6F1FB; --blu-ink: #042C53;
    --bad: #A32D2D; --bad-bg: #FCEBEB;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1A1A18; --ink: #F1EFE8; --muted: #B4B2A9; --lane: #232321; --card: #262624; --stroke: #444441;
      --core: #AFA9EC; --core-bg: #26215C; --core-ink: #EEEDFE;
      --hw: #EF9F27; --hw-bg: #412402; --hw-ink: #FAEEDA;
      --ret: #5DCAA5; --ret-bg: #04342C; --ret-ink: #E1F5EE;
      --blu: #85B7EB; --blu-bg: #042C53; --blu-ink: #E6F1FB;
      --bad: #F09595; --bad-bg: #501313;
    }
  }
  body { margin: 0; background: var(--bg); padding: 20px; font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  figure { margin: 0 auto; max-width: 1000px; }
  svg { width: 100%; height: auto; display: block; }
  .t { fill: var(--ink); font-size: 15px; font-weight: 700; }
  .s { fill: var(--muted); font-size: 12.5px; }
  .l { fill: var(--ink); font-size: 13px; font-weight: 700; }
  .m { font-family: "JetBrains Mono", Consolas, monospace; }
  .ico { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .arr { stroke: var(--muted); stroke-width: 1.8; fill: none; }
</style>
</head>
<body>
<figure>
<svg viewBox="0 0 1000 640" role="img" aria-label="하드 디스크 윗면(플래터, 트랙, 섹터, 스핀들, 헤드, 암)과 옆면(플래터 3장, 헤드 6개, 실린더), 그리고 4KB 무작위 읽기의 접근 시간 분해(탐색, 회전 지연, 전송)">
  <defs>
    <marker id="ah-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="var(--muted)"/></marker>
    <marker id="ah-core" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="var(--core)"/></marker>
    <marker id="ah-hw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="var(--hw)"/></marker>
  </defs>
  <rect x="20" y="20" width="420" height="400" rx="16" fill="var(--lane)"/>
  <circle cx="215" cy="238" r="165" fill="var(--card)" stroke="var(--stroke)" stroke-width="1.6"/>
  <circle cx="215" cy="238" r="145" fill="none" stroke="var(--stroke)" stroke-width="1.2"/>
  <circle cx="215" cy="238" r="122" fill="none" stroke="var(--stroke)" stroke-width="1.2"/>
  <circle cx="215" cy="238" r="99" fill="none" stroke="var(--stroke)" stroke-width="1.2"/>
  <circle cx="215" cy="238" r="76" fill="none" stroke="var(--stroke)" stroke-width="1.2"/>
  <circle cx="215" cy="238" r="99" fill="none" stroke="var(--core)" stroke-width="2.4"/>
  <path d="M281.2 311.6 A99 99 0 0 1 245.6 332.2" fill="none" stroke="var(--hw)" stroke-width="16" stroke-linecap="butt"/>
  <circle cx="215" cy="238" r="30" fill="var(--hw-bg)" stroke="var(--hw)" stroke-width="1.6"/>
  <text class="l" x="215" y="243" text-anchor="middle" style="fill:var(--hw-ink)">스핀들</text>
  <path d="M306.0 80.4 A182 182 0 0 0 124.0 80.4" fill="none" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah-muted)"/>
  <text class="l" x="215" y="48" text-anchor="middle">회전</text>
  <line x1="405" y1="395" x2="352.9" y2="193.2" stroke="var(--ink)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="405" cy="395" r="11" fill="var(--card)" stroke="var(--ink)" stroke-width="2.4"/>
  <rect x="345.9" y="186.2" width="14" height="14" rx="3" fill="var(--core)"/>
  <line x1="338.0" y1="175.3" x2="309.4" y2="189.9" stroke="var(--core)" stroke-width="2.4" marker-end="url(#ah-core)"/>
  <rect x="295.5" y="151.1" width="40" height="22" rx="6" fill="var(--card)"/>

  <text class="l" x="366.9" y="187.2">헤드</text>
  <text class="l" x="391.0" y="298.1">암</text>
  <line x1="62" y1="62" x2="92.4" y2="127.6" stroke="var(--muted)" stroke-width="1.2"/>
  <text class="l" x="36" y="56">플래터</text>
  <line x1="62" y1="388" x2="103.9" y2="331.2" stroke="var(--muted)" stroke-width="1.2"/>
  <text class="l" x="36" y="404">트랙</text>
  <line x1="270.5" y1="331.7" x2="300" y2="388" stroke="var(--muted)" stroke-width="1.2"/>
  <text class="l" x="290" y="404" style="fill:var(--hw)">섹터</text>
  <rect x="460" y="20" width="520" height="400" rx="16" fill="var(--lane)"/>
  <rect x="632" y="92" width="18" height="262" rx="4" fill="var(--hw-bg)" stroke="var(--hw)" stroke-width="1.4"/>
  <rect x="610" y="352" width="62" height="24" rx="6" fill="var(--hw-bg)" stroke="var(--hw)" stroke-width="1.4"/>
  <text class="l" x="641" y="400" text-anchor="middle" style="fill:var(--hw-ink)">스핀들</text>
  <rect x="733" y="100" width="18" height="236" rx="4" fill="var(--core-bg)" stroke="var(--core)" stroke-width="1.4" stroke-dasharray="5 4"/>
  <rect x="500" y="122" width="282" height="12" rx="6" fill="var(--card)" stroke="var(--ink)" stroke-width="1.6"/>
  <rect x="734" y="122" width="16" height="12" fill="var(--core)"/>
  <line x1="905" y1="110" x2="756" y2="110" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
  <rect x="736" y="114" width="18" height="6" rx="2" fill="var(--core)"/>
  <line x1="905" y1="146" x2="756" y2="146" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
  <rect x="736" y="136" width="18" height="6" rx="2" fill="var(--core)"/>
  <rect x="500" y="212" width="282" height="12" rx="6" fill="var(--card)" stroke="var(--ink)" stroke-width="1.6"/>
  <rect x="734" y="212" width="16" height="12" fill="var(--core)"/>
  <line x1="905" y1="200" x2="756" y2="200" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
  <rect x="736" y="204" width="18" height="6" rx="2" fill="var(--core)"/>
  <line x1="905" y1="236" x2="756" y2="236" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
  <rect x="736" y="226" width="18" height="6" rx="2" fill="var(--core)"/>
  <rect x="500" y="302" width="282" height="12" rx="6" fill="var(--card)" stroke="var(--ink)" stroke-width="1.6"/>
  <rect x="734" y="302" width="16" height="12" fill="var(--core)"/>
  <line x1="905" y1="290" x2="756" y2="290" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
  <rect x="736" y="294" width="18" height="6" rx="2" fill="var(--core)"/>
  <line x1="905" y1="326" x2="756" y2="326" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
  <rect x="736" y="316" width="18" height="6" rx="2" fill="var(--core)"/>
  <rect x="900" y="100" width="20" height="236" rx="6" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/>
  <text class="l" x="490" y="133" text-anchor="end">플래터</text>
  <text class="l" x="742" y="88" text-anchor="middle" style="fill:var(--core)">헤드</text>
  <text class="l" x="830" y="88" text-anchor="middle">암</text>
  <text class="l" x="742" y="368" text-anchor="middle" style="fill:var(--core)">실린더</text>
  <text class="s" x="964" y="404" text-anchor="end">표면 <tspan class="m">6</tspan> · 헤드 <tspan class="m">6</tspan></text>
  <rect x="20" y="440" width="960" height="180" rx="16" fill="var(--lane)"/>
  <text class="t" x="40" y="474">4 KB 무작위 읽기</text>
  <text class="t m" x="960" y="474" text-anchor="end">T = 탐색 + 회전 + 전송</text>
  <text class="t m" x="40" y="526">Cheetah 15K.5</text>
  <text class="s m" x="40" y="544">15,000 RPM</text>
  <rect x="236" y="512" width="160.0" height="32" rx="6" fill="var(--core)"/>
  <text class="l" x="316.0" y="533" text-anchor="middle" style="fill:var(--bg)">탐색 <tspan class="m">4 ms</tspan></text>
  <rect x="398.0" y="512" width="78.0" height="32" rx="6" fill="var(--hw)"/>
  <text class="l" x="436.0" y="533" text-anchor="middle" style="fill:var(--bg)">회전 <tspan class="m">2 ms</tspan></text>
  <rect x="478.0" y="512" width="4" height="32" rx="1" fill="var(--ret)"/>
  <text class="l" x="490.0" y="533" style="fill:var(--ret)">전송 <tspan class="m">0.03 ms</tspan></text>
  <text class="t m" x="960" y="533" text-anchor="end">≈ 6.0 ms</text>
  <text class="t m" x="40" y="588">Barracuda</text>
  <text class="s m" x="40" y="606">7,200 RPM</text>
  <rect x="236" y="574" width="360.0" height="32" rx="6" fill="var(--core)"/>
  <text class="l" x="416.0" y="595" text-anchor="middle" style="fill:var(--bg)">탐색 <tspan class="m">9 ms</tspan></text>
  <rect x="598.0" y="574" width="164.7" height="32" rx="6" fill="var(--hw)"/>
  <text class="l" x="679.3" y="595" text-anchor="middle" style="fill:var(--bg)">회전 <tspan class="m">4.17 ms</tspan></text>
  <rect x="764.7" y="574" width="4" height="32" rx="1" fill="var(--ret)"/>
  <text class="l" x="776.7" y="595" style="fill:var(--ret)">전송 <tspan class="m">0.04 ms</tspan></text>
  <text class="t m" x="960" y="595" text-anchor="end">≈ 13.2 ms</text>
</svg>
</figure>
</body>
</html>
