<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Fault Flow</title>
<style>
  :root {
    --bg: #FAF9F5; --ink: #2C2C2A; --muted: #6B6A64; --lane: #F1EFE8; --card: #FFFFFF; --stroke: #D3D1C7;
    --core: #534AB7; --core-bg: #EEEDFE; --core-ink: #26215C;
    --hw: #BA7517; --hw-bg: #FAEEDA; --hw-ink: #633806;
    --ret: #0F6E56; --ret-bg: #E1F5EE; --ret-ink: #04342C;
    --blu: #185FA5; --blu-bg: #E6F1FB; --blu-ink: #042C53;
    --bad: #A32D2D; --bad-bg: #FCEBEB;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1A1A18; --ink: #F1EFE8; --muted: #B4B2A9; --lane: #232321; --card: #262624; --stroke: #444441;
      --core: #AFA9EC; --core-bg: #26215C; --core-ink: #EEEDFE;
      --hw: #EF9F27; --hw-bg: #412402; --hw-ink: #FAEEDA;
      --ret: #5DCAA5; --ret-bg: #04342C; --ret-ink: #E1F5EE;
      --blu: #85B7EB; --blu-bg: #042C53; --blu-ink: #E6F1FB;
      --bad: #F09595; --bad-bg: #501313;
    }
  }
  body { margin: 0; background: var(--bg); padding: 20px; font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  figure { margin: 0 auto; max-width: 1000px; }
  svg { width: 100%; height: auto; display: block; }
  .t { fill: var(--ink); font-size: 15px; font-weight: 700; }
  .s { fill: var(--muted); font-size: 12.5px; }
  .l { fill: var(--ink); font-size: 13px; font-weight: 700; }
  .m { font-family: "JetBrains Mono", Consolas, monospace; }
  .ico { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .arr { stroke: var(--muted); stroke-width: 1.8; fill: none; }
</style>
</head>
<body>
<figure>
<svg viewBox="0 0 1000 500" role="img" aria-label="페이지 폴트 처리 흐름: 사용자 프로세스가 명령어를 실행하고, MMU가 PTE의 present 비트가 0인 것을 보고 페이지 폴트 트랩을 일으킨다. 커널은 주소를 검사해 잘못된 주소면 SIGSEGV로 종료하고, 유효하면 빈 프레임을 확보(없으면 교체, dirty면 내보내기)한 뒤 스왑 공간에서 페이지를 읽는다. 그동안 프로세스는 대기하고 다른 프로세스가 CPU를 쓴다. 읽기가 끝나면 페이지 테이블을 갱신하고 명령어를 재실행한다">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="var(--muted)"/></marker>
    <marker id="ah-core" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="var(--core)"/></marker>
    <marker id="ah-hw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="var(--hw)"/></marker>
    <marker id="ah-ret" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="var(--ret)"/></marker>
    <marker id="ah-bad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="var(--bad)"/></marker>
  </defs>
  <rect x="24" y="16" width="952" height="112" rx="16" fill="var(--lane)"/>
  <text class="s" x="960" y="38" text-anchor="end" style="font-weight:700">사용자 프로세스</text>
  <rect x="24" y="146" width="952" height="112" rx="16" fill="var(--hw-bg)" opacity="0.55"/>
  <text class="s" x="960" y="168" text-anchor="end" style="font-weight:700;fill:var(--hw)">하드웨어 · <tspan class="m">MMU</tspan></text>
  <rect x="24" y="276" width="952" height="122" rx="16" fill="var(--core-bg)" stroke="var(--core)" stroke-width="1.2"/>
  <text class="s" x="960" y="298" text-anchor="end" style="font-weight:700;fill:var(--core)">운영체제 · 커널</text>
  <rect x="40" y="46" width="200" height="62" rx="12" fill="var(--card)" stroke="var(--stroke)" stroke-width="1.6"/>
  <circle cx="64" cy="77.0" r="12" fill="var(--muted)"/>
  <text class="m" x="64" y="82.0" text-anchor="middle" font-size="13" font-weight="700" fill="var(--bg)">1</text>
  <text class="t" x="86" y="73" style="fill:var(--ink)">명령어 실행</text>
  <text class="s m" x="86" y="93">load [A]</text>
  <rect x="40" y="180" width="200" height="62" rx="12" fill="var(--hw-bg)" stroke="var(--hw)" stroke-width="1.6"/>
  <circle cx="64" cy="211.0" r="12" fill="var(--hw)"/>
  <text class="m" x="64" y="216.0" text-anchor="middle" font-size="13" font-weight="700" fill="var(--bg)">2</text>
  <text class="t" x="86" y="207" style="fill:var(--hw-ink)">주소 변환</text>
  <text class="s m" x="86" y="227">TLB miss → PTE</text>
  <text class="s m" x="286" y="192" style="font-weight:700">PTE</text>
  <rect x="286" y="200" width="64" height="42" rx="7" fill="var(--card)" stroke="var(--stroke)" stroke-width="1"/>
  <text class="m" x="318.0" y="216" text-anchor="middle" font-size="10.5" fill="var(--muted)">valid</text>
  <text class="m" x="318.0" y="235" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">1</text>
  <rect x="354" y="200" width="72" height="42" rx="7" fill="var(--bad-bg)" stroke="var(--bad)" stroke-width="1.6"/>
  <text class="m" x="390.0" y="216" text-anchor="middle" font-size="10.5" fill="var(--muted)">present</text>
  <text class="m" x="390.0" y="235" text-anchor="middle" font-size="14" font-weight="700" fill="var(--bad)">0</text>
  <rect x="430" y="200" width="92" height="42" rx="7" fill="var(--card)" stroke="var(--stroke)" stroke-width="1"/>
  <text class="m" x="476.0" y="216" text-anchor="middle" font-size="10.5" fill="var(--muted)">disk addr</text>
  <text class="m" x="476.0" y="235" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">blk 7</text>
  <line x1="242" y1="211" x2="282" y2="211" stroke="var(--hw)" stroke-dasharray="3 3"/>
  <rect x="40" y="318" width="200" height="62" rx="12" fill="var(--card)" stroke="var(--core)" stroke-width="1.6"/>
  <circle cx="64" cy="349.0" r="12" fill="var(--core)"/>
  <text class="m" x="64" y="354.0" text-anchor="middle" font-size="13" font-weight="700" fill="var(--bg)">3</text>
  <text class="t" x="86" y="345" style="fill:var(--core-ink)">주소 검사</text>
  <text class="s m" x="86" y="365">valid?</text>
  <rect x="276" y="318" width="200" height="62" rx="12" fill="var(--card)" stroke="var(--core)" stroke-width="1.6"/>
  <circle cx="300" cy="349.0" r="12" fill="var(--core)"/>
  <text class="m" x="300" y="354.0" text-anchor="middle" font-size="13" font-weight="700" fill="var(--bg)">4</text>
  <text class="t" x="322" y="345" style="fill:var(--core-ink)">빈 프레임 확보</text>
  <text class="s m" x="322" y="365">free list / evict</text>
  <rect x="512" y="318" width="200" height="62" rx="12" fill="var(--card)" stroke="var(--core)" stroke-width="1.6"/>
  <circle cx="536" cy="349.0" r="12" fill="var(--core)"/>
  <text class="m" x="536" y="354.0" text-anchor="middle" font-size="13" font-weight="700" fill="var(--bg)">5</text>
  <text class="t" x="558" y="345" style="fill:var(--core-ink)">디스크에서 읽기</text>
  <text class="s m" x="558" y="365">I/O · blocked</text>
  <rect x="748" y="318" width="200" height="62" rx="12" fill="var(--card)" stroke="var(--core)" stroke-width="1.6"/>
  <circle cx="772" cy="349.0" r="12" fill="var(--core)"/>
  <text class="m" x="772" y="354.0" text-anchor="middle" font-size="13" font-weight="700" fill="var(--bg)">6</text>
  <text class="t" x="794" y="345" style="fill:var(--core-ink)">페이지 테이블 갱신</text>
  <text class="s m" x="794" y="365">present=1 · PFN</text>
  <rect x="748" y="46" width="200" height="62" rx="12" fill="var(--ret-bg)" stroke="var(--ret)" stroke-width="1.6"/>
  <circle cx="772" cy="77.0" r="12" fill="var(--ret)"/>
  <text class="m" x="772" y="82.0" text-anchor="middle" font-size="13" font-weight="700" fill="var(--bg)">7</text>
  <text class="t" x="794" y="73" style="fill:var(--ret-ink)">명령어 재실행</text>
  <text class="s m" x="794" y="93">restart</text>
  <rect x="276" y="52" width="436" height="50" rx="12" fill="none" stroke="var(--muted)" stroke-dasharray="5 4"/>
  <text class="l" x="494.0" y="74" text-anchor="middle">대기 <tspan class="m" style="fill:var(--muted);font-weight:400">blocked</tspan></text>
  <text class="s" x="494.0" y="93" text-anchor="middle">다른 프로세스가 CPU 사용</text>
  <line class="arr" x1="140" y1="110" x2="140" y2="176" marker-end="url(#ah)"/>
  <line x1="140" y1="244" x2="140" y2="314" stroke="var(--hw)" stroke-width="2.2" marker-end="url(#ah-hw)"/>
  <text class="l" x="152" y="302" style="fill:var(--hw)">페이지 폴트 <tspan class="m" style="fill:var(--muted);font-weight:400">trap</tspan></text>
  <line x1="242" y1="349" x2="272" y2="349" stroke="var(--core)" stroke-width="2" marker-end="url(#ah-core)"/>
  <text class="s" x="258.0" y="341" text-anchor="middle" style="font-weight:700;fill:var(--core)">유효</text>
  <line x1="478" y1="349" x2="508" y2="349" stroke="var(--core)" stroke-width="2" marker-end="url(#ah-core)"/>
  <line x1="714" y1="349" x2="744" y2="349" stroke="var(--core)" stroke-width="2" marker-end="url(#ah-core)"/>
  <text class="s" x="730.0" y="341" text-anchor="middle" style="font-weight:700;fill:var(--core)">완료</text>
  <line x1="848" y1="314" x2="848" y2="112" stroke="var(--ret)" stroke-width="2.2" marker-end="url(#ah-ret)"/>
  <text class="l" x="836" y="206" text-anchor="end" style="fill:var(--ret)">재시도</text>
  <text class="s m" x="836" y="224" text-anchor="end">return-from-trap</text>
  <path d="M140 382 V426" fill="none" stroke="var(--bad)" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah-bad)"/>
  <text class="s" x="152" y="416" style="font-weight:700;fill:var(--bad)">잘못된 주소</text>
  <rect x="40" y="430" width="200" height="54" rx="12" fill="var(--bad-bg)" stroke="var(--bad)" stroke-width="1.6"/>
  <text class="t" x="140" y="454" text-anchor="middle" style="fill:var(--bad)">프로세스 종료</text>
  <text class="s m" x="140" y="473" text-anchor="middle">SIGSEGV</text>
  <path d="M376 382 V426" fill="none" stroke="var(--muted)" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text class="s" x="388" y="416" style="font-weight:700">빈 프레임 없음</text>
  <rect x="276" y="430" width="200" height="54" rx="12" fill="var(--card)" stroke="var(--stroke)" stroke-width="1.4"/>
  <text class="t" x="376" y="454" text-anchor="middle">교체 · victim</text>
  <text class="s m" x="376" y="473" text-anchor="middle">dirty → write</text>
  <rect x="512" y="430" width="200" height="54" rx="12" fill="var(--blu-bg)" stroke="var(--blu)" stroke-width="1.6"/>
  <ellipse cx="542" cy="447" rx="13" ry="5" fill="none" stroke="var(--blu-ink)" stroke-width="2"/>
  <path d="M529 447 V467 A13 5 0 0 0 555 467 V447" fill="none" stroke="var(--blu-ink)" stroke-width="2"/>
  <path d="M529 457 A13 5 0 0 0 555 457" fill="none" stroke="var(--blu-ink)" stroke-width="2"/>
  <text class="t" x="568" y="454" style="fill:var(--blu-ink)">스왑 공간</text>
  <text class="s m" x="568" y="473">swap · file</text>
  <line x1="478" y1="457" x2="508" y2="457" stroke="var(--muted)" stroke-width="1.8" marker-end="url(#ah)"/>
  <text class="s m" x="494.0" y="449" text-anchor="middle">out</text>
  <line x1="612" y1="428" x2="612" y2="384" stroke="var(--blu)" stroke-width="2.2" marker-end="url(#ah)"/>
  <text class="s m" x="624" y="416" style="font-weight:700;fill:var(--blu)">page in</text>
</svg>
</figure>
</body>
</html>
