<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sandbox Checks</title>
<style>
  :root {
    --bg: #FAF9F5; --ink: #2C2C2A; --muted: #6B6A64; --lane: #F1EFE8; --card: #FFFFFF; --stroke: #D3D1C7;
    --core: #534AB7; --core-bg: #EEEDFE; --core-ink: #26215C;
    --hw: #BA7517; --hw-bg: #FAEEDA; --hw-ink: #633806; --ret: #0F6E56; --ret-bg: #E1F5EE;
    --bad: #A32D2D; --bad-bg: #FCEBEB;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1A1A18; --ink: #F1EFE8; --muted: #B4B2A9; --lane: #232321; --card: #262624; --stroke: #444441;
      --core: #AFA9EC; --core-bg: #26215C; --core-ink: #EEEDFE;
      --hw: #EF9F27; --hw-bg: #412402; --hw-ink: #FAEEDA; --ret: #5DCAA5; --ret-bg: #04342C;
      --bad: #F09595; --bad-bg: #501313;
    }
  }
  body { margin: 0; background: var(--bg); padding: 20px; font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  figure { margin: 0 auto; max-width: 1000px; }
  svg { width: 100%; height: auto; display: block; }
  .t { fill: var(--ink); font-size: 15px; font-weight: 700; }
  .s { fill: var(--muted); font-size: 12.5px; }
  .m { font-family: "JetBrains Mono", Consolas, monospace; }
  .chip { font-family: "JetBrains Mono", Consolas, monospace; font-size: 11.5px; font-weight: 700; text-anchor: middle; }
  .ico { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .b text { font-size: 13px; font-weight: 700; fill: #fff; text-anchor: middle; }
</style>
</head>
<body>
<figure>
<svg viewBox="0 0 1000 520" role="img" aria-label="UID 1000에 CAP_NET_BIND_SERVICE 하나만 가진 웹 서버 프로세스가 bind(:80) 시스템 콜을 하면 커널은 1 seccomp 필터(ALLOW, ERRNO, KILL), 2 네임스페이스가 정한 보이는 범위(pid, mnt, net, user), 3 권한 검사(파일은 rwx 비트, 1024 미만 포트는 CAP_*)를 거쳐 파일·포트·프로세스 같은 객체에 닿는다. 오른쪽 위는 root(UID 0)의 권한을 CAP_NET_BIND_SERVICE, CAP_DAC_OVERRIDE, CAP_SETUID, CAP_KILL, CAP_SYS_PTRACE, CAP_SYS_ADMIN 같은 capability로 쪼갠 모습">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="var(--muted)"/></marker>
    <marker id="ah-core" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="var(--core)"/></marker>
  </defs>

  <!-- user mode lane -->
  <rect x="30" y="20" width="940" height="170" rx="16" fill="var(--lane)"/>
  <text class="t" x="52" y="48">사용자 모드</text>

  <!-- process card -->
  <rect x="52" y="66" width="350" height="104" rx="12" fill="var(--card)" stroke="var(--stroke)"/>
  <g class="ico" stroke="var(--ink)" transform="translate(70 80)"><rect x="0" y="0" width="22" height="9" rx="2"/><rect x="0" y="13" width="22" height="9" rx="2"/><path d="M5 4.5h1M5 17.5h1"/></g>
  <text class="t" x="104" y="98">웹 서버 프로세스</text>
  <rect x="68" y="122" width="96" height="32" rx="8" fill="var(--lane)" stroke="var(--stroke)"/>
  <text class="chip" x="116" y="142" fill="var(--ink)">uid 1000</text>
  <rect x="174" y="122" width="212" height="32" rx="8" fill="var(--ret-bg)" stroke="var(--ret)"/>
  <text class="chip" x="280" y="142" fill="var(--ret)">CAP_NET_BIND_SERVICE</text>

  <!-- root split panel -->
  <rect x="440" y="40" width="514" height="136" rx="12" fill="var(--card)" stroke="var(--stroke)"/>
  <rect x="458" y="62" width="104" height="92" rx="10" fill="var(--bad-bg)" stroke="var(--bad)" stroke-width="1.4"/>
  <g class="ico" stroke="var(--bad)" transform="translate(497 72)"><path d="M1 16l3-12 6 6 3-8 3 8 6-6 3 12z"/><path d="M1 21h24"/></g>
  <text class="m" x="510" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="var(--bad)">root</text>
  <text class="m" x="510" y="140" text-anchor="middle" font-size="11.5" fill="var(--bad)">UID 0</text>
  <line x1="566" y1="108" x2="596" y2="108" stroke="var(--muted)" stroke-width="1.6" marker-end="url(#ah)"/>
  <g>
    <rect x="604" y="54" width="168" height="30" rx="8" fill="var(--ret-bg)" stroke="var(--ret)"/>
    <text class="chip" x="688" y="73" fill="var(--ret)">CAP_NET_BIND_SERVICE</text>
    <rect x="778" y="54" width="160" height="30" rx="8" fill="var(--card)" stroke="var(--stroke)"/>
    <text class="chip" x="858" y="73" fill="var(--muted)">CAP_DAC_OVERRIDE</text>
    <rect x="604" y="93" width="168" height="30" rx="8" fill="var(--card)" stroke="var(--stroke)"/>
    <text class="chip" x="688" y="112" fill="var(--muted)">CAP_SETUID</text>
    <rect x="778" y="93" width="160" height="30" rx="8" fill="var(--card)" stroke="var(--stroke)"/>
    <text class="chip" x="858" y="112" fill="var(--muted)">CAP_KILL</text>
    <rect x="604" y="132" width="168" height="30" rx="8" fill="var(--card)" stroke="var(--stroke)"/>
    <text class="chip" x="688" y="151" fill="var(--muted)">CAP_SYS_PTRACE</text>
    <rect x="778" y="132" width="160" height="30" rx="8" fill="var(--card)" stroke="var(--stroke)"/>
    <text class="chip" x="858" y="151" fill="var(--muted)">CAP_SYS_ADMIN …</text>
  </g>

  <!-- kernel lane -->
  <rect x="30" y="210" width="940" height="290" rx="16" fill="var(--core-bg)" stroke="var(--core)" stroke-width="1.4"/>
  <text class="t" x="948" y="238" text-anchor="end" style="fill:var(--core-ink)">커널 모드</text>

  <!-- syscall arrow -->
  <line x1="165" y1="172" x2="165" y2="272" stroke="var(--core)" stroke-width="2.4" marker-end="url(#ah-core)"/>
  <rect x="180" y="214" width="112" height="28" rx="8" fill="var(--card)" stroke="var(--core)"/>
  <text class="chip" x="236" y="233" fill="var(--core)">bind(:80)</text>

  <!-- stage 1: seccomp -->
  <rect x="52" y="278" width="226" height="86" rx="12" fill="var(--card)" stroke="var(--core)" stroke-width="1.4"/>
  <g class="b"><circle cx="78" cy="304" r="12" fill="var(--core)"/><text x="78" y="309">1</text></g>
  <text class="t m" x="98" y="309" style="fill:var(--core-ink)">seccomp</text>
  <text class="s" x="98" y="338">번호 · 인자 필터</text>
  <!-- stage 2: namespace -->
  <rect x="320" y="278" width="200" height="86" rx="12" fill="var(--card)" stroke="var(--core)" stroke-width="1.4"/>
  <g class="b"><circle cx="346" cy="304" r="12" fill="var(--core)"/><text x="346" y="309">2</text></g>
  <text class="t" x="366" y="309" style="fill:var(--core-ink)">네임스페이스</text>
  <text class="s" x="366" y="338">보이는 범위</text>
  <!-- stage 3: permission -->
  <rect x="562" y="278" width="200" height="86" rx="12" fill="var(--card)" stroke="var(--core)" stroke-width="1.4"/>
  <g class="b"><circle cx="588" cy="304" r="12" fill="var(--core)"/><text x="588" y="309">3</text></g>
  <text class="t" x="608" y="309" style="fill:var(--core-ink)">권한 검사</text>
  <text class="s" x="608" y="338">rwx 비트 · capability</text>
  <!-- object -->
  <rect x="806" y="278" width="142" height="196" rx="12" fill="var(--card)" stroke="var(--stroke)"/>
  <text class="t" x="877" y="306" text-anchor="middle">객체</text>
  <g class="ico" stroke="var(--muted)">
    <path transform="translate(826 324)" d="M0 0h10l6 6v14H0z M10 0v6h6"/>
    <g transform="translate(826 376)"><rect x="0" y="4" width="18" height="12" rx="2"/><path d="M5 4V1h8v3M5 10h8"/></g>
    <g transform="translate(826 428)"><rect x="0" y="0" width="18" height="18" rx="3"/><path d="M4 6l4 3-4 3M10 13h4"/></g>
  </g>
  <text class="t" x="856" y="340" font-size="14">파일</text>
  <text class="t" x="856" y="392" font-size="14">포트 <tspan class="m">80</tspan></text>
  <text class="t" x="856" y="444" font-size="14">프로세스</text>

  <!-- stage arrows -->
  <line x1="280" y1="321" x2="316" y2="321" stroke="var(--core)" stroke-width="2" marker-end="url(#ah-core)"/>
  <line x1="522" y1="321" x2="558" y2="321" stroke="var(--core)" stroke-width="2" marker-end="url(#ah-core)"/>
  <line x1="764" y1="321" x2="802" y2="321" stroke="var(--core)" stroke-width="2" marker-end="url(#ah-core)"/>

  <!-- stage 1 outcomes -->
  <rect x="52" y="388" width="70" height="30" rx="8" fill="var(--ret-bg)" stroke="var(--ret)"/>
  <text class="chip" x="87" y="407" fill="var(--ret)">ALLOW</text>
  <rect x="130" y="388" width="70" height="30" rx="8" fill="var(--hw-bg)" stroke="var(--hw)"/>
  <text class="chip" x="165" y="407" fill="var(--hw-ink)">ERRNO</text>
  <rect x="208" y="388" width="70" height="30" rx="8" fill="var(--bad-bg)" stroke="var(--bad)"/>
  <text class="chip" x="243" y="407" fill="var(--bad)">KILL</text>
  <text class="s m" x="52" y="452" font-size="11.5">fork · execve 상속</text>

  <!-- stage 2 views -->
  <g>
    <rect x="320" y="388" width="44" height="30" rx="8" fill="var(--card)" stroke="var(--core)"/>
    <text class="chip" x="342" y="407" fill="var(--core)">pid</text>
    <rect x="372" y="388" width="44" height="30" rx="8" fill="var(--card)" stroke="var(--core)"/>
    <text class="chip" x="394" y="407" fill="var(--core)">mnt</text>
    <rect x="424" y="388" width="44" height="30" rx="8" fill="var(--card)" stroke="var(--core)"/>
    <text class="chip" x="446" y="407" fill="var(--core)">net</text>
    <rect x="476" y="388" width="44" height="30" rx="8" fill="var(--card)" stroke="var(--core)"/>
    <text class="chip" x="498" y="407" fill="var(--core)">user</text>
  </g>
  <text class="s m" x="320" y="452" font-size="11.5">clone · unshare · setns</text>

  <!-- stage 3 checks -->
  <rect x="562" y="388" width="88" height="30" rx="8" fill="var(--card)" stroke="var(--core)"/>
  <text class="chip" x="606" y="407" fill="var(--core)">rwx</text>
  <text class="s" x="663" y="408" text-anchor="middle">·</text>
  <rect x="676" y="388" width="86" height="30" rx="8" fill="var(--ret-bg)" stroke="var(--ret)"/>
  <text class="chip" x="719" y="407" fill="var(--ret)">CAP_*</text>
  <text class="s m" x="562" y="452" font-size="11.5">port &lt; 1024 → CAP</text>
</svg>
</figure>
</body>
</html>
