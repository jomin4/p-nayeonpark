<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Critical Section</title>
<style>
  :root {
    --bg: #FAF9F5; --ink: #2C2C2A; --muted: #6B6A64; --lane: #F1EFE8; --card: #FFFFFF; --stroke: #D3D1C7;
    --core: #534AB7; --core-bg: #EEEDFE; --core-ink: #26215C;
    --hw: #BA7517; --hw-bg: #FAEEDA; --hw-ink: #633806;
    --ret: #0F6E56; --ret-bg: #E1F5EE; --ret-ink: #04342C;
    --blu: #185FA5; --blu-bg: #E6F1FB; --blu-ink: #042C53;
    --bad: #A32D2D; --bad-bg: #FCEBEB;
    --gray: #5F5E5A; --gray-bg: #E8E6DE;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1A1A18; --ink: #F1EFE8; --muted: #B4B2A9; --lane: #232321; --card: #262624; --stroke: #444441;
      --core: #AFA9EC; --core-bg: #26215C; --core-ink: #EEEDFE;
      --hw: #EF9F27; --hw-bg: #412402; --hw-ink: #FAEEDA;
      --ret: #5DCAA5; --ret-bg: #04342C; --ret-ink: #E1F5EE;
      --blu: #85B7EB; --blu-bg: #042C53; --blu-ink: #E6F1FB;
      --bad: #F09595; --bad-bg: #501313;
      --gray: #B4B2A9; --gray-bg: #2C2C2A;
    }
  }
  body { margin: 0; background: var(--bg); padding: 20px; font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  figure { margin: 0 auto; max-width: 1000px; }
  svg { width: 100%; height: auto; display: block; }
  .t { fill: var(--ink); font-size: 15px; font-weight: 700; }
  .s { fill: var(--muted); font-size: 12.5px; }
  .m { font-family: "JetBrains Mono", Consolas, monospace; }
  .ico { fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<figure>
<svg viewBox="0 0 1000 470" role="img" aria-label="진입 구역, 임계 구역, 퇴출 구역, 나머지 구역이 반복되는 구조와, 임계 구역 문제의 해결책이 지켜야 하는 세 조건(상호 배제, 진행, 한정 대기)">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="var(--muted)"/></marker>
    <marker id="ah-core" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="var(--core)"/></marker>
    <marker id="ah-hw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="var(--hw)"/></marker>
    <marker id="ah-ret" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="var(--ret)"/></marker>
    <marker id="ah-blu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="var(--blu)"/></marker>
    <marker id="ah-bad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="var(--bad)"/></marker>
  </defs>
  <rect x="30" y="20" width="460" height="430" rx="16" fill="var(--lane)"/>
  <rect x="510" y="20" width="460" height="430" rx="16" fill="var(--lane)"/>
  <text class="t" x="54" y="52">반복 구조</text>
  <text class="s m" x="466" y="51" text-anchor="end">while (1) { ... }</text>
  <text class="t" x="534" y="52">세 조건</text>
  <text class="s m" x="946" y="51" text-anchor="end">critical-section problem</text>
  <rect x="110" y="78" width="350" height="60" rx="12" fill="var(--card)" stroke="var(--blu)" stroke-width="1.4"/>
  <text class="t" x="132" y="105">진입 구역</text>
  <text class="s m" x="132" y="124">entry section</text>
  <rect x="378.4" y="94" width="65.6" height="28" rx="8" fill="var(--blu-bg)" stroke="var(--blu)" stroke-width="1"/>
  <text class="m" x="411.2" y="113" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--blu-ink)">lock()</text>
  <rect x="110" y="166" width="350" height="60" rx="12" fill="var(--core-bg)" stroke="var(--core)" stroke-width="2.4"/>
  <text class="t" x="132" y="193">임계 구역</text>
  <text class="s m" x="132" y="212">critical section</text>
  <rect x="352.6" y="182" width="91.39999999999999" height="28" rx="8" fill="var(--core-bg)" stroke="var(--core)" stroke-width="1"/>
  <text class="m" x="398.3" y="201" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--core-ink)">counter++</text>
  <rect x="110" y="254" width="350" height="60" rx="12" fill="var(--card)" stroke="var(--blu)" stroke-width="1.4"/>
  <text class="t" x="132" y="281">퇴출 구역</text>
  <text class="s m" x="132" y="300">exit section</text>
  <rect x="361.2" y="270" width="82.8" height="28" rx="8" fill="var(--blu-bg)" stroke="var(--blu)" stroke-width="1"/>
  <text class="m" x="402.6" y="289" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--blu-ink)">unlock()</text>
  <rect x="110" y="342" width="350" height="60" rx="12" fill="var(--card)" stroke="var(--gray)" stroke-width="1.4"/>
  <text class="t" x="132" y="369">나머지 구역</text>
  <text class="s m" x="132" y="388">remainder section</text>
  <line x1="285" y1="139" x2="285" y2="162" stroke="var(--muted)" stroke-width="1.8" marker-end="url(#ah)"/>
  <line x1="285" y1="227" x2="285" y2="250" stroke="var(--muted)" stroke-width="1.8" marker-end="url(#ah)"/>
  <line x1="285" y1="315" x2="285" y2="338" stroke="var(--muted)" stroke-width="1.8" marker-end="url(#ah)"/>
  <path d="M285 402 V424 H70 V108 H104" fill="none" stroke="var(--muted)" stroke-width="1.8" marker-end="url(#ah)"/>
  <rect x="530" y="76" width="420" height="108" rx="12" fill="var(--card)" stroke="var(--stroke)" stroke-width="1.4"/>
  <circle cx="562" cy="108" r="14" fill="var(--core)"/><text x="562" y="113" text-anchor="middle" font-size="14" font-weight="700" fill="var(--bg)">1</text>
  <text class="t" x="588" y="114" font-size="16">상호 배제</text>
  <text class="s m" x="588" y="136">mutual exclusion</text>
  <text class="s" x="588" y="160" style="fill:var(--ink)">한 번에 하나만</text>
  <rect x="530" y="196" width="420" height="108" rx="12" fill="var(--card)" stroke="var(--stroke)" stroke-width="1.4"/>
  <circle cx="562" cy="228" r="14" fill="var(--core)"/><text x="562" y="233" text-anchor="middle" font-size="14" font-weight="700" fill="var(--bg)">2</text>
  <text class="t" x="588" y="234" font-size="16">진행</text>
  <text class="s m" x="588" y="256">progress</text>
  <text class="s" x="588" y="280" style="fill:var(--ink)">비어 있으면 곧 결정</text>
  <rect x="530" y="316" width="420" height="108" rx="12" fill="var(--card)" stroke="var(--stroke)" stroke-width="1.4"/>
  <circle cx="562" cy="348" r="14" fill="var(--core)"/><text x="562" y="353" text-anchor="middle" font-size="14" font-weight="700" fill="var(--bg)">3</text>
  <text class="t" x="588" y="354" font-size="16">한정 대기</text>
  <text class="s m" x="588" y="376">bounded waiting</text>
  <text class="s" x="588" y="400" style="fill:var(--ink)">추월 횟수에 상한</text>
  <rect x="850" y="102" width="80" height="56" rx="10" fill="var(--core-bg)" stroke="var(--core)" stroke-width="1.6"/>
  <path class="ico" stroke="var(--core)" d="M875 132 q5 -9 10 0 t10 0 t10 0"/>
  <path class="ico" stroke="var(--hw)" d="M790 132 q5 -9 10 0 t10 0 t10 0"/>
  <line x1="836" y1="114" x2="836" y2="148" stroke="var(--bad)" stroke-width="3" stroke-linecap="round"/>
  <rect x="850" y="222" width="80" height="56" rx="10" fill="var(--card)" stroke="var(--core)" stroke-width="1.6" stroke-dasharray="5 4"/>
  <path class="ico" stroke="var(--hw)" d="M778 252 q5 -9 10 0 t10 0 t10 0"/>
  <line x1="814" y1="250" x2="864" y2="250" stroke="var(--ret)" stroke-width="2.2" marker-end="url(#ah-ret)"/>
  <rect x="850" y="342" width="80" height="56" rx="10" fill="var(--core-bg)" stroke="var(--core)" stroke-width="1.6"/>
  <path class="ico" stroke="var(--core)" d="M875 372 q5 -9 10 0 t10 0 t10 0"/>
  <circle cx="780" cy="370" r="9" fill="var(--hw-bg)" stroke="var(--hw)" stroke-width="1.6"/>
  <circle cx="810" cy="370" r="9" fill="var(--hw-bg)" stroke="var(--hw)" stroke-width="1.6"/>
  <path d="M766 390 v6 h58 v-6" fill="none" stroke="var(--muted)" stroke-width="1.4"/>
  <text class="m" x="795" y="412" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--muted)">≤ k</text>
</svg>
</figure>
</body>
</html>
