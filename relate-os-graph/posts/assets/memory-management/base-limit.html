<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Base Limit MMU</title>
<style>
  :root {
    --bg: #FAF9F5; --ink: #2C2C2A; --muted: #6B6A64; --lane: #F1EFE8; --card: #FFFFFF; --stroke: #D3D1C7;
    --core: #534AB7; --core-bg: #EEEDFE; --core-ink: #26215C;
    --hw: #BA7517; --hw-bg: #FAEEDA; --hw-ink: #633806; --ret: #0F6E56; --ret-bg: #E1F5EE;
    --bad: #A32D2D; --bad-bg: #FCEBEB;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1A1A18; --ink: #F1EFE8; --muted: #B4B2A9; --lane: #232321; --card: #262624; --stroke: #444441;
      --core: #AFA9EC; --core-bg: #26215C; --core-ink: #EEEDFE;
      --hw: #EF9F27; --hw-bg: #412402; --hw-ink: #FAEEDA; --ret: #5DCAA5; --ret-bg: #04342C;
      --bad: #F09595; --bad-bg: #501313;
    }
  }
  body { margin: 0; background: var(--bg); padding: 20px; font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  figure { margin: 0 auto; max-width: 1000px; }
  svg { width: 100%; height: auto; display: block; }
  .t { fill: var(--ink); font-size: 15px; font-weight: 700; }
  .s { fill: var(--muted); font-size: 12.5px; }
  .m { font-family: "JetBrains Mono", Consolas, monospace; }
  .ico { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .arr { stroke: var(--muted); stroke-width: 1.8; fill: none; }
</style>
</head>
<body>
<figure>
<svg viewBox="0 0 1000 430" role="img" aria-label="CPU가 낸 논리 주소 2500을 MMU가 한계 레지스터 8192와 비교하고 베이스 레지스터 40960을 더해 물리 주소 43460으로 바꾼다. 논리 주소 9000처럼 한계를 넘으면 예외가 나서 커널로 넘어간다">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="var(--muted)"/></marker>
    <marker id="ah-core" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="var(--core)"/></marker>
    <marker id="ah-ret" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="var(--ret)"/></marker>
    <marker id="ah-bad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="var(--bad)"/></marker>
  </defs>

  <!-- CPU -->
  <rect x="30" y="110" width="150" height="120" rx="16" fill="var(--lane)"/>
  <g class="ico" transform="translate(83 128)">
    <rect x="4" y="4" width="36" height="36" rx="5"/><rect x="13" y="13" width="18" height="18" rx="2"/>
    <path d="M14 0v4M22 0v4M30 0v4M14 40v4M22 40v4M30 40v4M0 14h4M0 22h4M0 30h4M40 14h4M40 22h4M40 30h4"/>
  </g>
  <text class="t" x="105" y="200" text-anchor="middle">CPU</text>
  <text class="s m" x="105" y="218" text-anchor="middle">process P</text>

  <!-- logical address -->
  <line x1="182" y1="165" x2="268" y2="165" stroke="var(--core)" stroke-width="2.2" marker-end="url(#ah-core)"/>
  <rect x="190" y="124" width="70" height="26" rx="8" fill="var(--core-bg)" stroke="var(--core)"/>
  <text class="m" x="225" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="var(--core-ink)">2500</text>
  <text class="s" x="225" y="186" text-anchor="middle">논리 주소</text>

  <!-- MMU lane -->
  <rect x="272" y="40" width="408" height="360" rx="16" fill="var(--hw-bg)" stroke="var(--hw)" stroke-width="1.4"/>
  <text x="292" y="68" font-size="16" font-weight="700" fill="var(--hw-ink)">MMU</text>
  <text class="s" x="342" y="68">하드웨어</text>

  <!-- registers -->
  <rect x="292" y="84" width="178" height="40" rx="10" fill="var(--card)" stroke="var(--hw)"/>
  <text class="t" x="306" y="109" font-size="13.5" style="fill:var(--hw-ink)">한계</text>
  <text class="s m" x="344" y="109">limit = 8192</text>
  <rect x="486" y="84" width="174" height="40" rx="10" fill="var(--card)" stroke="var(--hw)"/>
  <text class="t" x="498" y="109" font-size="13.5" style="fill:var(--hw-ink)">베이스</text>
  <text class="s m" x="554" y="109">base = 40960</text>

  <!-- compare -->
  <rect x="292" y="140" width="160" height="50" rx="12" fill="var(--card)" stroke="var(--stroke)"/>
  <text class="t m" x="372" y="164" text-anchor="middle" font-size="14">2500 &lt; 8192 ?</text>
  <text class="s" x="372" y="182" text-anchor="middle">보호 검사</text>
  <line class="arr" x1="372" y1="126" x2="372" y2="137" marker-end="url(#ah)"/>

  <!-- yes -> add -->
  <line x1="454" y1="165" x2="496" y2="165" stroke="var(--ret)" stroke-width="2" marker-end="url(#ah-ret)"/>
  <text class="s" x="475" y="156" text-anchor="middle" style="fill:var(--ret);font-weight:700">예</text>
  <rect x="500" y="140" width="160" height="50" rx="12" fill="var(--card)" stroke="var(--stroke)"/>
  <text class="t m" x="580" y="164" text-anchor="middle" font-size="14">2500 + 40960</text>
  <text class="s" x="580" y="182" text-anchor="middle">재배치</text>
  <line class="arr" x1="580" y1="126" x2="580" y2="137" marker-end="url(#ah)"/>

  <!-- no -> exception -->
  <line x1="372" y1="192" x2="372" y2="298" stroke="var(--bad)" stroke-width="2" marker-end="url(#ah-bad)"/>
  <text class="s" x="384" y="226" style="fill:var(--bad);font-weight:700">아니오</text>
  <rect x="384" y="238" width="128" height="26" rx="8" fill="var(--card)" stroke="var(--bad)"/>
  <text class="m" x="448" y="256" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--bad)">9000 ≥ 8192</text>
  <rect x="292" y="302" width="160" height="60" rx="12" fill="var(--bad-bg)" stroke="var(--bad)"/>
  <text class="t" x="372" y="328" text-anchor="middle" style="fill:var(--bad)">예외</text>
  <text class="s m" x="372" y="347" text-anchor="middle">trap → kernel</text>

  <!-- privileged note -->
  <rect x="500" y="302" width="160" height="60" rx="12" fill="var(--card)" stroke="var(--stroke)"/>
  <g class="ico" transform="translate(514 318)" style="stroke-width:1.8">
    <rect x="1" y="11" width="20" height="16" rx="3"/><path d="M5 11V7a6 6 0 0 1 12 0v4"/>
  </g>
  <text class="t" x="546" y="329" font-size="13.5">설정은 커널만</text>
  <text class="s m" x="546" y="347">privileged</text>

  <!-- physical address -->
  <path d="M662 165 H790 V168 H822" fill="none" stroke="var(--core)" stroke-width="2.2" marker-end="url(#ah-core)"/>
  <rect x="700" y="124" width="74" height="26" rx="8" fill="var(--core-bg)" stroke="var(--core)"/>
  <text class="m" x="737" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="var(--core-ink)">43460</text>
  <text class="s" x="737" y="190" text-anchor="middle">물리 주소</text>

  <!-- physical memory: 0..64KB, y = 390 - k*5.3125 -->
  <text class="t" x="895" y="32" text-anchor="middle">물리 메모리</text>
  <rect x="830" y="50" width="130" height="85" rx="8" fill="none" stroke="var(--stroke)" stroke-dasharray="5 5"/>
  <text class="s" x="895" y="97" text-anchor="middle">빈 공간</text>
  <rect x="830" y="135" width="130" height="42.5" rx="8" fill="var(--core-bg)" stroke="var(--core)" stroke-width="1.6"/>
  <text class="t" x="895" y="161" text-anchor="middle" style="fill:var(--core-ink)">프로세스 P</text>
  <circle cx="836" cy="168" r="3.5" fill="var(--core)"/>
  <rect x="830" y="177.5" width="130" height="127.5" rx="8" fill="var(--card)" stroke="var(--stroke)"/>
  <text class="s" x="895" y="246" text-anchor="middle">다른 프로세스</text>
  <rect x="830" y="305" width="130" height="85" rx="8" fill="var(--lane)" stroke="var(--stroke)"/>
  <text class="t" x="895" y="352" text-anchor="middle">운영체제</text>

  <!-- ticks -->
  <g class="s m" font-size="11.5" text-anchor="end">
    <text x="824" y="139">48 KB</text>
    <text x="824" y="182">40 KB</text>
    <text x="824" y="309">16 KB</text>
    <text x="824" y="394">0</text>
  </g>
  <path d="M966 137 h6 V176 h-6" stroke="var(--core)" stroke-width="1.6" fill="none"/>
  <text class="s m" x="978" y="160" style="fill:var(--core);font-weight:700">8K</text>
</svg>
</figure>
</body>
</html>
