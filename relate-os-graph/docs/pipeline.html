<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Production Pipeline</title>
<style>
  :root {
    --bg: #FAF9F5; --ink: #2C2C2A; --muted: #6B6A64; --line: #9A988F;
    --card: #FFFFFF; --card-stroke: #D9D6CC; --chip-bg: #FFFFFF;
    --term: #1F1E1D; --term-ink: #F1EFE8; --spark: #D97757;
    --ok: #0F6E56; --ok-bg: #E1F5EE;
    --rel-bg: #E1F5EE; --rel-stroke: #1D9E75; --rel-ink: #085041;
    --db-bg: #FAEEDA; --db-top: #FAC775; --db-stroke: #BA7517; --db-ink: #633806;
    --dash-bg: #EEEDFE; --dash-stroke: #534AB7; --dash-ink: #26215C;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1A1A18; --ink: #F1EFE8; --muted: #B4B2A9; --line: #888780;
      --card: #262624; --card-stroke: #444441; --chip-bg: #262624;
      --term: #0F0F0E;
      --ok: #5DCAA5; --ok-bg: #04342C;
      --rel-bg: #04342C; --rel-stroke: #5DCAA5; --rel-ink: #E1F5EE;
      --db-bg: #412402; --db-top: #633806; --db-stroke: #EF9F27; --db-ink: #FAEEDA;
      --dash-bg: #26215C; --dash-stroke: #AFA9EC; --dash-ink: #EEEDFE;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
    padding: 24px 16px; font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  figure { margin: 0; width: 100%; max-width: 1200px; }
  svg { width: 100%; height: auto; display: block; }
  .t { fill: var(--ink); font-size: 16px; font-weight: 700; }
  .m { fill: var(--muted); font-size: 12.5px; font-family: "JetBrains Mono", Consolas, monospace; }
  .ln { stroke: var(--line); stroke-width: 1.6; fill: none; }
  .dash { stroke-dasharray: 6 5; }
  .card { fill: var(--card); stroke: var(--card-stroke); stroke-width: 1.2; }
  .chip rect { fill: var(--chip-bg); stroke: var(--card-stroke); }
  .chip text { fill: var(--muted); font-size: 12px; font-family: "JetBrains Mono", Consolas, monospace; font-weight: 600; }
  .ico { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<figure>
<svg viewBox="0 0 1200 440" role="img" aria-labelledby="ttl">
  <title id="ttl">단원별 서브에이전트가 병렬로 글·시각화·그래프 데이터를 만들고, 메인 세션이 검증한 뒤 적재 에이전트 하나가 relate에 순차 적재하며, 같은 파일로 그래프 재구축과 대시보드 빌드를 하는 제작 파이프라인</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9z" fill="var(--line)"/>
    </marker>
  </defs>

  <!-- 1. subagents (stacked) -->
  <rect x="52" y="64" width="180" height="150" rx="14" fill="var(--term)" opacity=".35"/>
  <rect x="42" y="74" width="180" height="150" rx="14" fill="var(--term)" opacity=".6"/>
  <g>
    <rect x="32" y="84" width="180" height="150" rx="14" fill="var(--term)"/>
    <g stroke="var(--spark)" stroke-width="4" stroke-linecap="round" transform="translate(58 112)">
      <line x1="0" y1="-12" x2="0" y2="12"/><line x1="-12" y1="0" x2="12" y2="0"/>
      <line x1="-8.5" y1="-8.5" x2="8.5" y2="8.5"/><line x1="-8.5" y1="8.5" x2="8.5" y2="-8.5"/>
    </g>
    <text x="80" y="118" fill="var(--term-ink)" font-size="17" font-weight="700">subagent</text>
    <text x="122" y="168" fill="var(--term-ink)" font-size="30" font-weight="700" text-anchor="middle">× 4</text>
    <text x="122" y="206" fill="var(--term-ink)" font-size="12.5" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" opacity=".8">unit 02–13</text>
  </g>
  <text class="t" x="122" y="268" text-anchor="middle">조사 · 집필</text>
  <text class="m" x="122" y="288" text-anchor="middle">병렬 · 단원 1개씩</text>

  <line class="ln" x1="238" y1="159" x2="270" y2="159" marker-end="url(#ah)"/>

  <!-- 2. repo files -->
  <g>
    <rect class="card" x="280" y="84" width="190" height="150" rx="14"/>
    <g font-family="JetBrains Mono, Consolas, monospace" font-size="12.5" font-weight="600" fill="var(--ink)">
      <rect x="296" y="102" width="158" height="32" rx="7" fill="var(--bg)" stroke="var(--card-stroke)"/>
      <text x="310" y="123">posts/*.md</text>
      <rect x="296" y="142" width="158" height="32" rx="7" fill="var(--bg)" stroke="var(--card-stroke)"/>
      <text x="310" y="163">assets/*.png</text>
      <rect x="296" y="182" width="158" height="32" rx="7" fill="var(--bg)" stroke="var(--card-stroke)"/>
      <text x="310" y="203">graph-data/*.json</text>
    </g>
  </g>
  <text class="t" x="375" y="268" text-anchor="middle">레포 파일</text>
  <text class="m" x="375" y="288" text-anchor="middle">원본 · git 관리</text>

  <line class="ln" x1="476" y1="159" x2="508" y2="159" marker-end="url(#ah)"/>

  <!-- 3. validate -->
  <g>
    <rect x="518" y="84" width="160" height="150" rx="14" fill="var(--ok-bg)" stroke="var(--ok)" stroke-width="1.4"/>
    <circle cx="598" cy="138" r="26" fill="none" stroke="var(--ok)" stroke-width="2.6"/>
    <path d="M585 138 l9 9 l17 -18" fill="none" stroke="var(--ok)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="598" y="196" text-anchor="middle" font-size="12.5" font-weight="600" fill="var(--ok)" font-family="JetBrains Mono, Consolas, monospace">validate_topic.py</text>
    <text x="598" y="216" text-anchor="middle" font-size="12" fill="var(--ok)">PNG 검수 · 수치 재계산</text>
  </g>
  <text class="t" x="598" y="268" text-anchor="middle">검증</text>
  <text class="m" x="598" y="288" text-anchor="middle">메인 세션</text>

  <line class="ln" x1="684" y1="159" x2="716" y2="159" marker-end="url(#ah)"/>

  <!-- 4. loader -->
  <g>
    <rect class="card" x="726" y="84" width="170" height="150" rx="14"/>
    <g class="ico" transform="translate(793 104)">
      <rect x="0" y="16" width="36" height="28" rx="5"/>
      <path d="M8 16 V10 a10 10 0 0 1 20 0 V16"/>
      <circle cx="18" cy="30" r="3"/>
    </g>
    <text x="811" y="178" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)">한 번에 하나</text>
    <text class="m" x="811" y="202" text-anchor="middle">load-topic.cypher</text>
    <text class="m" x="811" y="220" text-anchor="middle">× 2 pass</text>
  </g>
  <text class="t" x="811" y="268" text-anchor="middle">적재 에이전트</text>
  <text class="m" x="811" y="288" text-anchor="middle">single writer</text>

  <line class="ln" x1="902" y1="159" x2="962" y2="159" marker-end="url(#ah)"/>
  <g class="chip"><rect x="902" y="128" width="58" height="22" rx="11"/><text x="931" y="143" text-anchor="middle">MCP</text></g>

  <!-- 5. db -->
  <g stroke="var(--db-stroke)" stroke-width="1.8">
    <path d="M972 104 V212 A62 15 0 0 0 1096 212 V104" fill="var(--db-bg)"/>
    <path d="M972 140 A62 15 0 0 0 1096 140" fill="none" stroke-opacity=".7"/>
    <path d="M972 176 A62 15 0 0 0 1096 176" fill="none" stroke-opacity=".7"/>
    <ellipse cx="1034" cy="104" rx="62" ry="15" fill="var(--db-top)"/>
  </g>
  <text class="t" x="1034" y="268" text-anchor="middle">relate</text>
  <text class="m" x="1034" y="288" text-anchor="middle" style="fill:var(--db-ink)">os-graph.rl</text>

  <!-- rebuild (CLI) -->
  <path class="ln dash" d="M456 238 V330 H1034 V306" marker-end="url(#ah)"/>
  <g class="chip"><rect x="596" y="319" width="176" height="22" rx="11"/><text x="684" y="334" text-anchor="middle">rebuild-graph.ps1 · CLI</text></g>

  <!-- dashboard build -->
  <path class="ln" d="M294 238 V390 H930" marker-end="url(#ah)"/>
  <g class="chip"><rect x="572" y="379" width="224" height="22" rx="11"/><text x="684" y="394" text-anchor="middle">build_dashboard_data.py</text></g>
  <g>
    <rect x="940" y="356" width="220" height="68" rx="12" fill="var(--dash-bg)" stroke="var(--dash-stroke)" stroke-width="1.4"/>
    <g fill="none" stroke="var(--dash-ink)" stroke-width="2" stroke-linecap="round" transform="translate(960 372)">
      <rect x="0" y="0" width="40" height="36" rx="5"/>
      <circle cx="11" cy="14" r="4"/><circle cx="28" cy="10" r="3"/><circle cx="25" cy="26" r="3"/>
      <line x1="14" y1="16" x2="22" y2="24"/><line x1="14" y1="13" x2="25" y2="11"/>
    </g>
    <text x="1016" y="386" font-size="16" font-weight="700" fill="var(--dash-ink)">대시보드</text>
    <text x="1016" y="408" font-size="12.5" fill="var(--dash-ink)" font-family="JetBrains Mono, Consolas, monospace">docs/dashboard</text>
  </g>
</svg>
</figure>
</body>
</html>
