<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bounded Buffer</title>
<style>
  :root {
    --bg: #FAF9F5; --ink: #2C2C2A; --muted: #6B6A64; --lane: #F1EFE8; --card: #FFFFFF; --stroke: #D3D1C7;
    --core: #534AB7; --core-bg: #EEEDFE; --core-ink: #26215C;
    --hw: #BA7517; --hw-bg: #FAEEDA; --hw-ink: #633806;
    --ret: #0F6E56; --ret-bg: #E1F5EE; --ret-ink: #04342C;
    --blu: #185FA5; --blu-bg: #E6F1FB; --blu-ink: #042C53;
    --bad: #A32D2D; --bad-bg: #FCEBEB;
    --gray: #5F5E5A; --gray-bg: #E8E6DE;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1A1A18; --ink: #F1EFE8; --muted: #B4B2A9; --lane: #232321; --card: #262624; --stroke: #444441;
      --core: #AFA9EC; --core-bg: #26215C; --core-ink: #EEEDFE;
      --hw: #EF9F27; --hw-bg: #412402; --hw-ink: #FAEEDA;
      --ret: #5DCAA5; --ret-bg: #04342C; --ret-ink: #E1F5EE;
      --blu: #85B7EB; --blu-bg: #042C53; --blu-ink: #E6F1FB;
      --bad: #F09595; --bad-bg: #501313;
      --gray: #B4B2A9; --gray-bg: #2C2C2A;
    }
  }
  body { margin: 0; background: var(--bg); padding: 20px; font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  figure { margin: 0 auto; max-width: 1000px; }
  svg { width: 100%; height: auto; display: block; }
  .t { fill: var(--ink); font-size: 15px; font-weight: 700; }
  .s { fill: var(--muted); font-size: 12.5px; }
  .m { font-family: "JetBrains Mono", Consolas, monospace; }
  .ico { fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<figure>
<svg viewBox="0 0 1000 490" role="img" aria-label="세마포어 empty, full, mutex로 푼 유한 버퍼 생산자-소비자 문제: 칸 10개 중 3개가 차 있어 empty=7, full=3이고, 생산자와 소비자가 각자 다섯 단계로 wait와 post를 호출한다">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="var(--muted)"/></marker>
    <marker id="ah-core" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="var(--core)"/></marker>
    <marker id="ah-hw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="var(--hw)"/></marker>
    <marker id="ah-ret" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="var(--ret)"/></marker>
    <marker id="ah-blu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="var(--blu)"/></marker>
    <marker id="ah-bad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="var(--bad)"/></marker>
  </defs>
  <rect x="30" y="20" width="200" height="450" rx="16" fill="var(--lane)"/>
  <rect x="250" y="20" width="500" height="450" rx="16" fill="var(--lane)"/>
  <rect x="770" y="20" width="200" height="450" rx="16" fill="var(--lane)"/>
  <text class="t" x="50" y="52" font-size="16">생산자</text>
  <text class="s m" x="210" y="51" text-anchor="end">producer</text>
  <rect x="50" y="72" width="160" height="46" rx="12" fill="var(--hw-bg)" stroke="var(--hw)" stroke-width="1.4"/>
  <path class="ico" stroke="var(--hw)" d="M68 97 q5 -9 10 0 t10 0 t10 0"/>
  <text class="t m" x="114" y="101" style="fill:var(--hw-ink)">P1</text>
  <rect x="50" y="130" width="160" height="46" rx="12" fill="var(--hw-bg)" stroke="var(--hw)" stroke-width="1.4"/>
  <path class="ico" stroke="var(--hw)" d="M68 155 q5 -9 10 0 t10 0 t10 0"/>
  <text class="t m" x="114" y="159" style="fill:var(--hw-ink)">P2</text>
  <circle cx="62" cy="228" r="11" fill="var(--muted)"/><text x="62" y="233" text-anchor="middle" font-size="12" font-weight="700" fill="var(--bg)">1</text>
  <rect x="80" y="214" width="134" height="28" rx="8" fill="var(--ret-bg)" stroke="var(--ret)" stroke-width="1"/>
  <text class="m" x="147" y="233" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ret-ink)">sem_wait(&empty)</text>
  <circle cx="62" cy="276" r="11" fill="var(--muted)"/><text x="62" y="281" text-anchor="middle" font-size="12" font-weight="700" fill="var(--bg)">2</text>
  <rect x="80" y="262" width="134" height="28" rx="8" fill="var(--blu-bg)" stroke="var(--blu)" stroke-width="1"/>
  <text class="m" x="147" y="281" text-anchor="middle" font-size="12" font-weight="700" fill="var(--blu-ink)">sem_wait(&mutex)</text>
  <circle cx="62" cy="324" r="11" fill="var(--muted)"/><text x="62" y="329" text-anchor="middle" font-size="12" font-weight="700" fill="var(--bg)">3</text>
  <rect x="80" y="310" width="134" height="28" rx="8" fill="var(--card)" stroke="var(--hw)" stroke-width="1.4"/>
  <text class="m" x="147" y="329" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--hw)">put(i)</text>
  <circle cx="62" cy="372" r="11" fill="var(--muted)"/><text x="62" y="377" text-anchor="middle" font-size="12" font-weight="700" fill="var(--bg)">4</text>
  <rect x="80" y="358" width="134" height="28" rx="8" fill="var(--blu-bg)" stroke="var(--blu)" stroke-width="1"/>
  <text class="m" x="147" y="377" text-anchor="middle" font-size="12" font-weight="700" fill="var(--blu-ink)">sem_post(&mutex)</text>
  <circle cx="62" cy="420" r="11" fill="var(--muted)"/><text x="62" y="425" text-anchor="middle" font-size="12" font-weight="700" fill="var(--bg)">5</text>
  <rect x="80" y="406" width="134" height="28" rx="8" fill="var(--hw-bg)" stroke="var(--hw)" stroke-width="1"/>
  <text class="m" x="147" y="425" text-anchor="middle" font-size="12" font-weight="700" fill="var(--hw-ink)">sem_post(&full)</text>
  <text class="t" x="790" y="52" font-size="16">소비자</text>
  <text class="s m" x="950" y="51" text-anchor="end">consumer</text>
  <rect x="790" y="72" width="160" height="46" rx="12" fill="var(--core-bg)" stroke="var(--core)" stroke-width="1.4"/>
  <path class="ico" stroke="var(--core)" d="M808 97 q5 -9 10 0 t10 0 t10 0"/>
  <text class="t m" x="854" y="101" style="fill:var(--core-ink)">C1</text>
  <rect x="790" y="130" width="160" height="46" rx="12" fill="var(--core-bg)" stroke="var(--core)" stroke-width="1.4"/>
  <path class="ico" stroke="var(--core)" d="M808 155 q5 -9 10 0 t10 0 t10 0"/>
  <text class="t m" x="854" y="159" style="fill:var(--core-ink)">C2</text>
  <circle cx="802" cy="228" r="11" fill="var(--muted)"/><text x="802" y="233" text-anchor="middle" font-size="12" font-weight="700" fill="var(--bg)">1</text>
  <rect x="820" y="214" width="134" height="28" rx="8" fill="var(--hw-bg)" stroke="var(--hw)" stroke-width="1"/>
  <text class="m" x="887" y="233" text-anchor="middle" font-size="12" font-weight="700" fill="var(--hw-ink)">sem_wait(&full)</text>
  <circle cx="802" cy="276" r="11" fill="var(--muted)"/><text x="802" y="281" text-anchor="middle" font-size="12" font-weight="700" fill="var(--bg)">2</text>
  <rect x="820" y="262" width="134" height="28" rx="8" fill="var(--blu-bg)" stroke="var(--blu)" stroke-width="1"/>
  <text class="m" x="887" y="281" text-anchor="middle" font-size="12" font-weight="700" fill="var(--blu-ink)">sem_wait(&mutex)</text>
  <circle cx="802" cy="324" r="11" fill="var(--muted)"/><text x="802" y="329" text-anchor="middle" font-size="12" font-weight="700" fill="var(--bg)">3</text>
  <rect x="820" y="310" width="134" height="28" rx="8" fill="var(--card)" stroke="var(--core)" stroke-width="1.4"/>
  <text class="m" x="887" y="329" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--core)">get()</text>
  <circle cx="802" cy="372" r="11" fill="var(--muted)"/><text x="802" y="377" text-anchor="middle" font-size="12" font-weight="700" fill="var(--bg)">4</text>
  <rect x="820" y="358" width="134" height="28" rx="8" fill="var(--blu-bg)" stroke="var(--blu)" stroke-width="1"/>
  <text class="m" x="887" y="377" text-anchor="middle" font-size="12" font-weight="700" fill="var(--blu-ink)">sem_post(&mutex)</text>
  <circle cx="802" cy="420" r="11" fill="var(--muted)"/><text x="802" y="425" text-anchor="middle" font-size="12" font-weight="700" fill="var(--bg)">5</text>
  <rect x="820" y="406" width="134" height="28" rx="8" fill="var(--ret-bg)" stroke="var(--ret)" stroke-width="1"/>
  <text class="m" x="887" y="425" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ret-ink)">sem_post(&empty)</text>
  <rect x="260" y="40" width="150" height="64" rx="12" fill="var(--ret-bg)" stroke="var(--ret)" stroke-width="1.6"/>
  <text class="m" x="335" y="70" text-anchor="middle" font-size="16" font-weight="700" fill="var(--ret-ink)">empty = 7</text>
  <text class="s" x="335" y="92" text-anchor="middle">빈 칸</text>
  <rect x="425" y="40" width="150" height="64" rx="12" fill="var(--blu-bg)" stroke="var(--blu)" stroke-width="1.6"/>
  <text class="m" x="500" y="70" text-anchor="middle" font-size="16" font-weight="700" fill="var(--blu-ink)">mutex = 1</text>
  <text class="s" x="500" y="92" text-anchor="middle">락</text>
  <rect x="590" y="40" width="150" height="64" rx="12" fill="var(--hw-bg)" stroke="var(--hw)" stroke-width="1.6"/>
  <text class="m" x="665" y="70" text-anchor="middle" font-size="16" font-weight="700" fill="var(--hw-ink)">full = 3</text>
  <text class="s" x="665" y="92" text-anchor="middle">찬 칸</text>
  <rect x="270" y="268" width="42" height="56" rx="8" fill="var(--card)" stroke="var(--stroke)" stroke-width="1.4"/>
  <text class="s m" x="291" y="258" text-anchor="middle">0</text>
  <rect x="316" y="268" width="42" height="56" rx="8" fill="var(--card)" stroke="var(--stroke)" stroke-width="1.4"/>
  <text class="s m" x="337" y="258" text-anchor="middle">1</text>
  <rect x="362" y="268" width="42" height="56" rx="8" fill="var(--hw-bg)" stroke="var(--hw)" stroke-width="1.6"/>
  <text class="m" x="383" y="302" text-anchor="middle" font-size="14" font-weight="700" fill="var(--hw-ink)">13</text>
  <text class="s m" x="383" y="258" text-anchor="middle">2</text>
  <rect x="408" y="268" width="42" height="56" rx="8" fill="var(--hw-bg)" stroke="var(--hw)" stroke-width="1.6"/>
  <text class="m" x="429" y="302" text-anchor="middle" font-size="14" font-weight="700" fill="var(--hw-ink)">14</text>
  <text class="s m" x="429" y="258" text-anchor="middle">3</text>
  <rect x="454" y="268" width="42" height="56" rx="8" fill="var(--hw-bg)" stroke="var(--hw)" stroke-width="1.6"/>
  <text class="m" x="475" y="302" text-anchor="middle" font-size="14" font-weight="700" fill="var(--hw-ink)">15</text>
  <text class="s m" x="475" y="258" text-anchor="middle">4</text>
  <rect x="500" y="268" width="42" height="56" rx="8" fill="var(--card)" stroke="var(--stroke)" stroke-width="1.4"/>
  <text class="s m" x="521" y="258" text-anchor="middle">5</text>
  <rect x="546" y="268" width="42" height="56" rx="8" fill="var(--card)" stroke="var(--stroke)" stroke-width="1.4"/>
  <text class="s m" x="567" y="258" text-anchor="middle">6</text>
  <rect x="592" y="268" width="42" height="56" rx="8" fill="var(--card)" stroke="var(--stroke)" stroke-width="1.4"/>
  <text class="s m" x="613" y="258" text-anchor="middle">7</text>
  <rect x="638" y="268" width="42" height="56" rx="8" fill="var(--card)" stroke="var(--stroke)" stroke-width="1.4"/>
  <text class="s m" x="659" y="258" text-anchor="middle">8</text>
  <rect x="684" y="268" width="42" height="56" rx="8" fill="var(--card)" stroke="var(--stroke)" stroke-width="1.4"/>
  <text class="s m" x="705" y="258" text-anchor="middle">9</text>
  <text class="t" x="270" y="198">유한 버퍼</text>
  <text class="s m" x="730" y="197" text-anchor="end">buffer[MAX], MAX = 10</text>
  <path d="M732 296 H742 V224 H258 V296 H264" fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <rect x="462" y="212" width="76" height="24" rx="12" fill="var(--lane)"/>
  <text class="m" x="500" y="229" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--muted)">% MAX</text>
  <line x1="383" y1="374" x2="383" y2="332" stroke="var(--core)" stroke-width="2.2" marker-end="url(#ah-core)"/>
  <text class="m" x="383" y="396" text-anchor="middle" font-size="14" font-weight="700" fill="var(--core)">use</text>
  <text class="s m" x="383" y="416" text-anchor="middle">get</text>
  <line x1="521" y1="374" x2="521" y2="332" stroke="var(--hw)" stroke-width="2.2" marker-end="url(#ah-hw)"/>
  <text class="m" x="521" y="396" text-anchor="middle" font-size="14" font-weight="700" fill="var(--hw)">fill</text>
  <text class="s m" x="521" y="416" text-anchor="middle">put</text>
</svg>
</figure>
</body>
</html>
