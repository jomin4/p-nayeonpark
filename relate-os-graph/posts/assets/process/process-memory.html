<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Process Memory</title>
<style>
  :root {
    --bg: #FAF9F5; --ink: #2C2C2A; --muted: #6B6A64; --lane: #F1EFE8; --card: #FFFFFF; --stroke: #D3D1C7;
    --core: #534AB7; --core-bg: #EEEDFE; --core-ink: #26215C;
    --hw: #BA7517; --hw-bg: #FAEEDA; --hw-ink: #633806; --ret: #0F6E56; --ret-bg: #E1F5EE;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1A1A18; --ink: #F1EFE8; --muted: #B4B2A9; --lane: #232321; --card: #262624; --stroke: #444441;
      --core: #AFA9EC; --core-bg: #26215C; --core-ink: #EEEDFE;
      --hw: #EF9F27; --hw-bg: #412402; --hw-ink: #FAEEDA; --ret: #5DCAA5; --ret-bg: #04342C;
    }
  }
  body { margin: 0; background: var(--bg); padding: 20px; font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  figure { margin: 0 auto; max-width: 1000px; }
  svg { width: 100%; height: auto; display: block; }
  .t { fill: var(--ink); font-size: 15px; font-weight: 700; }
  .s { fill: var(--muted); font-size: 12.5px; }
  .m { font-family: "JetBrains Mono", Consolas, monospace; }
  .ico { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .arr { stroke: var(--muted); stroke-width: 1.8; fill: none; }
</style>
</head>
<body>
<figure>
<svg viewBox="0 0 1000 486" role="img" aria-label="디스크의 프로그램(코드와 데이터)이 메모리에 적재되어 코드, 데이터, 힙, 스택으로 이루어진 프로세스 주소 공간이 되고, 프로세스는 레지스터와 열린 파일도 가진다">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="var(--muted)"/></marker>
    <marker id="ah-core" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="var(--core)"/></marker>
  </defs>

  <!-- program on disk -->
  <rect x="40" y="130" width="230" height="230" rx="16" fill="var(--lane)"/>
  <g class="ico" transform="translate(72 158)" style="stroke:var(--muted)">
    <path d="M0 8 V40 A24 7 0 0 0 48 40 V8"/><ellipse cx="24" cy="8" rx="24" ry="7"/><path d="M0 24 A24 7 0 0 0 48 24"/>
  </g>
  <text class="t" x="136" y="180">프로그램</text>
  <text class="s m" x="136" y="200">a.out · disk</text>
  <rect x="70" y="236" width="170" height="44" rx="10" fill="var(--card)" stroke="var(--stroke)"/>
  <text class="t" x="155" y="263" text-anchor="middle">코드 <tspan class="s m" dx="4">code</tspan></text>
  <rect x="70" y="292" width="170" height="44" rx="10" fill="var(--card)" stroke="var(--stroke)"/>
  <text class="t" x="155" y="319" text-anchor="middle">데이터 <tspan class="s m" dx="4">data</tspan></text>

  <!-- load arrow -->
  <line x1="274" y1="245" x2="380" y2="245" stroke="var(--core)" stroke-width="2.2" marker-end="url(#ah-core)"/>
  <text class="t" x="326" y="232" text-anchor="middle" style="fill:var(--core)">적재</text>
  <text class="s m" x="326" y="268" text-anchor="middle">load</text>

  <!-- process lane -->
  <rect x="390" y="20" width="570" height="446" rx="16" fill="var(--core-bg)" stroke="var(--core)" stroke-width="1.4"/>
  <text x="410" y="48" font-size="16" font-weight="700" fill="var(--core-ink)">프로세스</text>
  <text class="s m" x="486" y="48">running program</text>

  <!-- address space column -->
  <text class="s" x="430" y="80">높은 주소</text>
  <!-- stack -->
  <rect x="430" y="88" width="230" height="58" rx="10" fill="var(--card)" stroke="var(--core)"/>
  <text class="t" x="545" y="122" text-anchor="middle" style="fill:var(--core-ink)">스택 <tspan class="s m" dx="4">stack</tspan></text>
  <!-- free -->
  <rect x="430" y="152" width="230" height="110" rx="10" fill="none" stroke="var(--stroke)" stroke-dasharray="5 5"/>
  <line class="arr" x1="545" y1="158" x2="545" y2="192" marker-end="url(#ah)"/>
  <line class="arr" x1="545" y1="256" x2="545" y2="222" marker-end="url(#ah)"/>
  <text class="s" x="560" y="212">빈 공간</text>
  <!-- heap -->
  <rect x="430" y="268" width="230" height="58" rx="10" fill="var(--card)" stroke="var(--core)"/>
  <text class="t" x="545" y="302" text-anchor="middle" style="fill:var(--core-ink)">힙 <tspan class="s m" dx="4">heap</tspan></text>
  <!-- data -->
  <rect x="430" y="332" width="230" height="44" rx="10" fill="var(--hw-bg)" stroke="var(--hw)"/>
  <text class="t" x="545" y="359" text-anchor="middle" style="fill:var(--hw-ink)">데이터 <tspan class="s m" dx="4">data</tspan></text>
  <!-- code -->
  <rect x="430" y="382" width="230" height="44" rx="10" fill="var(--hw-bg)" stroke="var(--hw)"/>
  <text class="t" x="545" y="409" text-anchor="middle" style="fill:var(--hw-ink)">코드 <tspan class="s m" dx="4">text</tspan></text>
  <text class="s" x="430" y="446">낮은 주소</text>

  <!-- segment labels -->
  <g class="s">
    <line x1="664" y1="117" x2="690" y2="117" stroke="var(--stroke)"/>
    <text x="698" y="113" style="fill:var(--ink);font-weight:700">지역 변수 · 반환 주소</text>
    <text x="698" y="131">함수 호출마다 ↓</text>
    <line x1="664" y1="297" x2="690" y2="297" stroke="var(--stroke)"/>
    <text x="698" y="293" style="fill:var(--ink);font-weight:700">동적 할당</text>
    <text class="m" x="698" y="311">malloc / free ↑</text>
    <line x1="664" y1="354" x2="690" y2="354" stroke="var(--stroke)"/>
    <text x="698" y="359" style="fill:var(--ink);font-weight:700">전역 · static 변수</text>
    <line x1="664" y1="404" x2="690" y2="404" stroke="var(--stroke)"/>
    <text x="698" y="409" style="fill:var(--ink);font-weight:700">기계어 명령</text>
  </g>
  <!-- bracket: from program -->
  <path d="M902 332 h10 V426 h-10" stroke="var(--hw)" stroke-width="1.6" fill="none"/>
  <text class="s m" x="920" y="384" style="fill:var(--hw);font-weight:700">a.out</text>

  <!-- registers & files chips -->
  <rect x="690" y="180" width="250" height="34" rx="10" fill="var(--card)" stroke="var(--stroke)"/>
  <g class="ico" transform="translate(702 187)" style="stroke-width:1.6">
    <rect x="2" y="2" width="16" height="16" rx="2"/><rect x="6" y="6" width="8" height="8"/>
  </g>
  <text class="t" x="732" y="202" font-size="13.5">레지스터</text>
  <text class="s m" x="806" y="202">PC · SP · …</text>
  <rect x="690" y="222" width="250" height="34" rx="10" fill="var(--card)" stroke="var(--stroke)"/>
  <g class="ico" transform="translate(704 228)" style="stroke-width:1.6">
    <path d="M0 0 H10 L15 5 V21 H0 Z"/><path d="M10 0 V5 H15"/>
  </g>
  <text class="t" x="732" y="244" font-size="13.5">열린 파일</text>
  <text class="s m" x="806" y="244">fd 0 · 1 · 2</text>
</svg>
</figure>
</body>
</html>
