<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scheduler Dispatcher</title>
<style>
  :root {
    --bg: #FAF9F5; --ink: #2C2C2A; --muted: #6B6A64; --lane: #F1EFE8; --card: #FFFFFF; --stroke: #D3D1C7;
    --core: #534AB7; --core-bg: #EEEDFE; --core-ink: #26215C;
    --hw: #BA7517; --hw-bg: #FAEEDA; --hw-ink: #633806;
    --ret: #0F6E56; --ret-bg: #E1F5EE; --ret-ink: #04342C;
    --blu: #185FA5; --blu-bg: #E6F1FB; --blu-ink: #042C53;
    --bad: #A32D2D; --bad-bg: #FCEBEB;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1A1A18; --ink: #F1EFE8; --muted: #B4B2A9; --lane: #232321; --card: #262624; --stroke: #444441;
      --core: #AFA9EC; --core-bg: #26215C; --core-ink: #EEEDFE;
      --hw: #EF9F27; --hw-bg: #412402; --hw-ink: #FAEEDA;
      --ret: #5DCAA5; --ret-bg: #04342C; --ret-ink: #E1F5EE;
      --blu: #85B7EB; --blu-bg: #042C53; --blu-ink: #E6F1FB;
      --bad: #F09595; --bad-bg: #501313;
    }
  }
  body { margin: 0; background: var(--bg); padding: 20px; font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  figure { margin: 0 auto; max-width: 1000px; }
  svg { width: 100%; height: auto; display: block; }
  .t { fill: var(--ink); font-size: 15px; font-weight: 700; }
  .s { fill: var(--muted); font-size: 12.5px; }
  .m { font-family: "JetBrains Mono", Consolas, monospace; }
  .ico { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .arr { stroke: var(--muted); stroke-width: 1.8; fill: none; }
</style>
</head>
<body>
<figure>
<svg viewBox="0 0 1000 450" role="img" aria-label="준비 큐에서 CPU 스케줄러가 다음 프로세스를 고르고 디스패처가 문맥 교환, 사용자 모드 전환, 점프를 거쳐 CPU에 넘기는 구조. 실행 중인 프로세스는 I/O 요청과 종료(모든 스케줄러가 개입), 타이머 인터럽트와 I/O 완료(선점형만 개입) 때 스케줄링 결정이 일어난다">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="var(--muted)"/></marker>
    <marker id="ah-core" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="var(--core)"/></marker>
    <marker id="ah-hw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="var(--hw)"/></marker>
    <marker id="ah-ret" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="var(--ret)"/></marker>
    <marker id="ah-bad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="var(--bad)"/></marker>
  </defs>

  <!-- ready queue -->
  <rect x="40" y="50" width="270" height="110" rx="16" fill="var(--lane)"/>
  <text class="t" x="58" y="78">준비 큐</text>
  <text class="s m" x="292" y="78" text-anchor="end">ready</text>
  <rect x="60" y="94" width="70" height="48" rx="10" fill="var(--card)" stroke="var(--stroke)"/>
  <text class="t m" x="95" y="124" text-anchor="middle">P2</text>
  <rect x="140" y="94" width="70" height="48" rx="10" fill="var(--card)" stroke="var(--stroke)"/>
  <text class="t m" x="175" y="124" text-anchor="middle">P3</text>
  <rect x="220" y="94" width="70" height="48" rx="10" fill="var(--card)" stroke="var(--stroke)"/>
  <text class="t m" x="255" y="124" text-anchor="middle">P4</text>
  <line class="arr" x1="312" y1="117" x2="336" y2="117" marker-end="url(#ah)"/>

  <!-- scheduler -->
  <rect x="340" y="60" width="160" height="114" rx="14" fill="var(--card)" stroke="var(--core)" stroke-width="1.6"/>
  <g class="ico" transform="translate(404 72)" style="stroke:var(--core)">
    <path d="M0 4 L4 8 L11 0"/><line x1="16" y1="4" x2="32" y2="4"/><line x1="16" y1="15" x2="32" y2="15"/><line x1="16" y1="26" x2="32" y2="26"/>
    <circle cx="5" cy="15" r="2"/><circle cx="5" cy="26" r="2"/>
  </g>
  <text class="t" x="420" y="134" text-anchor="middle" style="fill:var(--core-ink)">CPU 스케줄러</text>
  <text class="s m" x="420" y="156" text-anchor="middle">select</text>
  <line class="arr" x1="502" y1="117" x2="536" y2="117" marker-end="url(#ah)"/>

  <!-- dispatcher -->
  <rect x="540" y="40" width="220" height="152" rx="16" fill="var(--core-bg)" stroke="var(--core)" stroke-width="1.4"/>
  <text class="t" x="558" y="67" style="fill:var(--core-ink)">디스패처</text>
  <text class="s m" x="744" y="67" text-anchor="end">dispatch</text>
  <rect x="556" y="80" width="188" height="30" rx="8" fill="var(--card)" stroke="var(--core)"/>
  <text class="s" x="650" y="100" text-anchor="middle" style="fill:var(--ink);font-weight:700">문맥 교환</text>
  <rect x="556" y="116" width="188" height="30" rx="8" fill="var(--card)" stroke="var(--core)"/>
  <text class="s" x="650" y="136" text-anchor="middle" style="fill:var(--ink);font-weight:700">사용자 모드 전환</text>
  <rect x="556" y="152" width="188" height="30" rx="8" fill="var(--card)" stroke="var(--core)"/>
  <text class="s" x="650" y="172" text-anchor="middle" style="fill:var(--ink);font-weight:700">재개 위치로 점프</text>
  <path d="M540 204 v8 H760 v-8" fill="none" stroke="var(--muted)" stroke-width="1.4"/>
  <text class="s m" x="650" y="230" text-anchor="middle">dispatch latency</text>
  <line class="arr" x1="762" y1="117" x2="796" y2="117" marker-end="url(#ah)"/>

  <!-- running -->
  <rect x="800" y="60" width="160" height="114" rx="14" fill="var(--card)" stroke="var(--ink)" stroke-width="1.6"/>
  <g class="ico" transform="translate(860 66)">
    <rect x="6" y="6" width="28" height="28" rx="3"/><rect x="13" y="13" width="14" height="14"/>
    <path d="M14 6V1M20 6V1M26 6V1M14 34v5M20 34v5M26 34v5M6 14H1M6 20H1M6 26H1M34 14h5M34 20h5M34 26h5"/>
  </g>
  <text class="t" x="880" y="134" text-anchor="middle">실행</text>
  <text class="t m" x="880" y="157" text-anchor="middle" style="font-size:14px">P1</text>

  <!-- waiting -->
  <rect x="400" y="330" width="200" height="64" rx="14" fill="var(--lane)"/>
  <g class="ico" transform="translate(430 344)"><path d="M0 0 H20 M0 36 H20 M2 0 C2 12 18 12 18 18 C18 24 2 24 2 36 M18 0 C18 12 2 12 2 18 C2 24 18 24 18 36"/></g>
  <text class="t" x="520" y="360" text-anchor="middle">대기</text>
  <text class="s m" x="520" y="380" text-anchor="middle">waiting</text>
  <!-- exit -->
  <rect x="835" y="330" width="130" height="64" rx="14" fill="var(--lane)"/>
  <text class="t" x="900" y="360" text-anchor="middle">종료</text>
  <text class="s m" x="900" y="380" text-anchor="middle">exit</text>

  <!-- 2 timer interrupt: running -> ready (preempt) -->
  <path d="M822 176 V270 H175 V164" fill="none" stroke="var(--hw)" stroke-width="2.2" marker-end="url(#ah-hw)"/>
  <text class="s" x="300" y="262" style="fill:var(--hw);font-weight:700">타이머 인터럽트</text>
  <!-- 3 I/O done: waiting -> ready (preempt) -->
  <path d="M398 362 H110 V164" fill="none" stroke="var(--hw)" stroke-width="2.2" marker-end="url(#ah-hw)"/>
  <text class="s" x="200" y="354" style="fill:var(--hw);font-weight:700">I/O 완료</text>
  <!-- 1 I/O request: running -> waiting -->
  <path d="M850 176 V300 H520 V326" fill="none" stroke="var(--muted)" stroke-width="2.2" marker-end="url(#ah)"/>
  <text class="s" x="640" y="292" style="fill:var(--muted);font-weight:700">I/O · wait()</text>
  <!-- 4 exit -->
  <path d="M900 176 V326" fill="none" stroke="var(--muted)" stroke-width="2.2" marker-end="url(#ah)"/>
  <circle cx="740" cy="300" r="12" fill="var(--muted)"/>
  <text x="740" y="304.5" text-anchor="middle" font-size="13" font-weight="700" fill="var(--bg)" class="m">1</text>
  <circle cx="470" cy="270" r="12" fill="var(--hw)"/>
  <text x="470" y="274.5" text-anchor="middle" font-size="13" font-weight="700" fill="var(--bg)" class="m">2</text>
  <circle cx="290" cy="362" r="12" fill="var(--hw)"/>
  <text x="290" y="366.5" text-anchor="middle" font-size="13" font-weight="700" fill="var(--bg)" class="m">3</text>
  <circle cx="900" cy="250" r="12" fill="var(--muted)"/>
  <text x="900" y="254.5" text-anchor="middle" font-size="13" font-weight="700" fill="var(--bg)" class="m">4</text>

  <!-- legend -->
  <line x1="300" y1="428" x2="336" y2="428" stroke="var(--hw)" stroke-width="2.4"/>
  <text class="s" x="346" y="433" style="font-weight:700">선점형만 개입</text>
  <line x1="500" y1="428" x2="536" y2="428" stroke="var(--muted)" stroke-width="2.4"/>
  <text class="s" x="546" y="433" style="font-weight:700">모든 스케줄러 개입</text>
</svg>
</figure>
</body>
</html>
