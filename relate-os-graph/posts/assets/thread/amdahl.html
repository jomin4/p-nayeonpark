<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amdahl's Law</title>
<style>
  :root {
    --bg: #FAF9F5; --ink: #2C2C2A; --muted: #6B6A64; --lane: #F1EFE8; --card: #FFFFFF; --stroke: #D3D1C7; --grid: #E4E2DA;
    --p50: #A39CE8; --p75: #7F77DD; --p90: #534AB7; --p95: #2E2680;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1A1A18; --ink: #F1EFE8; --muted: #B4B2A9; --lane: #232321; --card: #262624; --stroke: #444441; --grid: #34342F;
      --p50: #5A52B5; --p75: #7E76D6; --p90: #A49EEA; --p95: #D6D3F7;
    }
  }
  body { margin: 0; background: var(--bg); padding: 20px; font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  figure { margin: 0 auto; max-width: 1000px; }
  svg { width: 100%; height: auto; display: block; }
  .t { fill: var(--ink); font-size: 16px; font-weight: 700; }
  .s { fill: var(--muted); font-size: 13px; }
  .m { font-family: "JetBrains Mono", Consolas, monospace; }
  .grid line { stroke: var(--grid); stroke-width: 1; }
  .tick { fill: var(--muted); font-size: 12.5px; font-family: "JetBrains Mono", Consolas, monospace; }
  .curve { fill: none; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
  .dot { stroke: var(--bg); stroke-width: 2; }
  .lab { fill: var(--ink); font-size: 13px; font-weight: 700; font-family: "JetBrains Mono", Consolas, monospace; }
  .tv { fill: var(--ink); font-size: 14px; font-weight: 700; font-family: "JetBrains Mono", Consolas, monospace; text-anchor: end; }
</style>
</head>
<body>
<figure>
<svg viewBox="0 0 1000 460" role="img" aria-label="암달의 법칙: 병렬 비율 50, 75, 90, 95퍼센트일 때 코어 수 1에서 64까지의 속도 향상 곡선과 한계값">
  <!-- axes titles -->
  <text class="s" x="100" y="44" style="font-weight:700">속도 향상</text>
  <text class="s m" x="700" y="446" text-anchor="end" style="font-weight:700">cores (N)</text>

  <!-- grid: y = 400 - S*17 -->
  <g class="grid">
    <line x1="100" y1="400" x2="700" y2="400" style="stroke:var(--muted)"/>
    <line x1="100" y1="315" x2="700" y2="315"/>
    <line x1="100" y1="230" x2="700" y2="230"/>
    <line x1="100" y1="145" x2="700" y2="145"/>
    <line x1="100" y1="60" x2="700" y2="60"/>
  </g>
  <g class="tick" text-anchor="end">
    <text x="88" y="404">0×</text>
    <text x="88" y="319">5×</text>
    <text x="88" y="234">10×</text>
    <text x="88" y="149">15×</text>
    <text x="88" y="64">20×</text>
  </g>
  <g class="tick" text-anchor="middle">
    <text x="100" y="422">1</text><text x="200" y="422">2</text><text x="300" y="422">4</text>
    <text x="400" y="422">8</text><text x="500" y="422">16</text><text x="600" y="422">32</text><text x="700" y="422">64</text>
  </g>

  <!-- curves: S(N) = 1 / ((1-p) + p/N), x = log2 N -->
  <path class="curve" stroke="var(--p50)" d="M100.0 383.0 L112.5 382.3 L125.0 381.5 L137.5 380.8 L150.0 380.1 L162.5 379.4 L175.0 378.7 L187.5 378.0 L200.0 377.3 L212.5 376.7 L225.0 376.1 L237.5 375.5 L250.0 374.9 L262.5 374.3 L275.0 373.8 L287.5 373.3 L300.0 372.8 L312.5 372.3 L325.0 371.9 L337.5 371.5 L350.0 371.1 L362.5 370.7 L375.0 370.4 L387.5 370.1 L400.0 369.8 L412.5 369.5 L425.0 369.2 L437.5 369.0 L450.0 368.8 L462.5 368.5 L475.0 368.4 L487.5 368.2 L500.0 368.0 L512.5 367.8 L525.0 367.7 L537.5 367.6 L550.0 367.4 L562.5 367.3 L575.0 367.2 L587.5 367.1 L600.0 367.0 L612.5 366.9 L625.0 366.9 L637.5 366.8 L650.0 366.7 L662.5 366.7 L675.0 366.6 L687.5 366.6 L700.0 366.5"/>
  <path class="curve" stroke="var(--p75)" d="M100.0 383.0 L112.5 381.9 L125.0 380.7 L137.5 379.5 L150.0 378.2 L162.5 376.9 L175.0 375.6 L187.5 374.2 L200.0 372.8 L212.5 371.4 L225.0 369.9 L237.5 368.5 L250.0 367.0 L262.5 365.5 L275.0 364.1 L287.5 362.6 L300.0 361.1 L312.5 359.7 L325.0 358.3 L337.5 356.9 L350.0 355.6 L362.5 354.2 L375.0 353.0 L387.5 351.7 L400.0 350.5 L412.5 349.4 L425.0 348.3 L437.5 347.3 L450.0 346.3 L462.5 345.3 L475.0 344.4 L487.5 343.5 L500.0 342.7 L512.5 342.0 L525.0 341.3 L537.5 340.6 L550.0 340.0 L562.5 339.4 L575.0 338.8 L587.5 338.3 L600.0 337.8 L612.5 337.4 L625.0 337.0 L637.5 336.6 L650.0 336.2 L662.5 335.9 L675.0 335.6 L687.5 335.3 L700.0 335.0"/>
  <path class="curve" stroke="var(--p90)" d="M100.0 383.0 L112.5 381.6 L125.0 380.2 L137.5 378.6 L150.0 376.9 L162.5 375.1 L175.0 373.2 L187.5 371.2 L200.0 369.1 L212.5 366.8 L225.0 364.5 L237.5 362.0 L250.0 359.3 L262.5 356.6 L275.0 353.8 L287.5 350.8 L300.0 347.7 L312.5 344.5 L325.0 341.2 L337.5 337.8 L350.0 334.4 L362.5 330.9 L375.0 327.3 L387.5 323.7 L400.0 320.0 L412.5 316.3 L425.0 312.6 L437.5 309.0 L450.0 305.3 L462.5 301.7 L475.0 298.1 L487.5 294.6 L500.0 291.2 L512.5 287.8 L525.0 284.6 L537.5 281.4 L550.0 278.4 L562.5 275.4 L575.0 272.6 L587.5 269.9 L600.0 267.3 L612.5 264.9 L625.0 262.5 L637.5 260.3 L650.0 258.2 L662.5 256.2 L675.0 254.4 L687.5 252.6 L700.0 251.0"/>
  <path class="curve" stroke="var(--p95)" d="M100.0 383.0 L112.5 381.5 L125.0 380.0 L137.5 378.3 L150.0 376.4 L162.5 374.5 L175.0 372.4 L187.5 370.1 L200.0 367.6 L212.5 365.0 L225.0 362.2 L237.5 359.2 L250.0 355.9 L262.5 352.5 L275.0 348.9 L287.5 345.0 L300.0 340.9 L312.5 336.5 L325.0 331.9 L337.5 327.1 L350.0 322.0 L362.5 316.7 L375.0 311.1 L387.5 305.3 L400.0 299.3 L412.5 293.0 L425.0 286.6 L437.5 279.9 L450.0 273.1 L462.5 266.1 L475.0 259.0 L487.5 251.9 L500.0 244.6 L512.5 237.2 L525.0 229.9 L537.5 222.5 L550.0 215.2 L562.5 207.9 L575.0 200.7 L587.5 193.6 L600.0 186.7 L612.5 179.9 L625.0 173.2 L637.5 166.8 L650.0 160.5 L662.5 154.5 L675.0 148.7 L687.5 143.2 L700.0 137.8"/>

  <!-- markers at N = 2^k -->
  <g class="dot" style="fill:var(--p95)">
    <circle cx="200" cy="367.6" r="4.5"/><circle cx="300" cy="340.9" r="4.5"/><circle cx="400" cy="299.3" r="4.5"/><circle cx="500" cy="244.6" r="4.5"/><circle cx="600" cy="186.7" r="4.5"/><circle cx="700" cy="137.8" r="4.5"/>
  </g>
  <g class="dot" style="fill:var(--p90)">
    <circle cx="200" cy="369.1" r="4.5"/><circle cx="300" cy="347.7" r="4.5"/><circle cx="400" cy="320.0" r="4.5"/><circle cx="500" cy="291.2" r="4.5"/><circle cx="600" cy="267.3" r="4.5"/><circle cx="700" cy="251.0" r="4.5"/>
  </g>
  <g class="dot" style="fill:var(--p75)">
    <circle cx="300" cy="361.1" r="4.5"/><circle cx="400" cy="350.5" r="4.5"/><circle cx="500" cy="342.7" r="4.5"/><circle cx="600" cy="337.8" r="4.5"/><circle cx="700" cy="335.0" r="4.5"/>
  </g>
  <g class="dot" style="fill:var(--p50)">
    <circle cx="400" cy="369.8" r="4.5"/><circle cx="500" cy="368.0" r="4.5"/><circle cx="600" cy="367.0" r="4.5"/><circle cx="700" cy="366.5" r="4.5"/>
  </g>
  <circle cx="100" cy="383" r="4.5" class="dot" style="fill:var(--muted)"/>

  <!-- direct labels -->
  <text class="lab" x="712" y="142">95%</text>
  <text class="lab" x="712" y="255">90%</text>
  <text class="lab" x="712" y="339">75%</text>
  <text class="lab" x="712" y="371">50%</text>

  <!-- value table -->
  <rect x="770" y="60" width="200" height="216" rx="12" fill="var(--lane)"/>
  <g class="s m" style="font-weight:700">
    <text x="790" y="90">p</text>
    <text x="896" y="90" text-anchor="end">N=64</text>
    <text x="954" y="90" text-anchor="end">N→∞</text>
  </g>
  <line x1="790" y1="102" x2="954" y2="102" stroke="var(--stroke)"/>
  <g stroke-width="3" stroke-linecap="round">
    <line x1="790" y1="130" x2="806" y2="130" stroke="var(--p95)"/>
    <line x1="790" y1="170" x2="806" y2="170" stroke="var(--p90)"/>
    <line x1="790" y1="210" x2="806" y2="210" stroke="var(--p75)"/>
    <line x1="790" y1="250" x2="806" y2="250" stroke="var(--p50)"/>
  </g>
  <g class="lab">
    <text x="814" y="135">95%</text><text x="814" y="175">90%</text><text x="814" y="215">75%</text><text x="814" y="255">50%</text>
  </g>
  <g class="tv">
    <text x="896" y="135">15.4×</text><text x="954" y="135">20×</text>
    <text x="896" y="175">8.8×</text><text x="954" y="175">10×</text>
    <text x="896" y="215">3.8×</text><text x="954" y="215">4×</text>
    <text x="896" y="255">2.0×</text><text x="954" y="255">2×</text>
  </g>
  <text class="m" x="870" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">S = 1 / ((1−p) + p/N)</text>
</svg>
</figure>
</body>
</html>
